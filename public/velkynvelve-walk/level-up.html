<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="/test-copy-silence.js"></script>
<title>Level Up · Ashes of Prometheus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap">
<!-- The Underwalk level-up (Sam, 2026-10-28; prototype https://claude.ai/artifact/5jSrEofrWEXGH5pmwvMf5M). Opened by the walk
     (scripts/velkynvelve-walk/template.html openLevelUp) in a full-screen frame: ?cid=<character uuid>&hero=<walk id>.
     It reads /api/walk-level-up (the ceremony preview) and /api/walk-level-choices (what is left to choose), takes the
     level, settles the choices, plays the class celebration, and tells the walk with postMessage. Skill:
     aop-level-up-experience. -->
<style>[hidden]{display:none!important}

/* Layout: one Arcane Reliquary panel — the hero on his candlelit stage at the left, one choice per screen at the right,
   big icon tiles, one line of words, BACK and NEXT. Gold hairlines, violet for what is chosen, candlelight at the edges.
   Single dark theme by choice: it is the game's screen. */
:root{
  color-scheme:dark;
  --room:#0a0814; --ar-panel:#15112a; --ar-panel2:#0d0b19; --ar-inset:#0b0914; --ar-brass:#6e5a34; --ar-gold:#c9a55c; --ar-gold-light:#f3dca0;
  --ar-violet:#8b6cff; --ar-violet-deep:#4f3ac2; --ar-text:#efe6d6; --ar-secondary:#b9ad9d; --ar-muted:#7f7690; --ar-equipped:#5fd08a; --ar-deny:#d1684f; --ar-rule:#2a2440;
  --face-display:"Cinzel",Georgia,"Times New Roman",serif; --face-body:"Crimson Text",Georgia,serif;
}
html,body{height:100%}
body{margin:0;background:var(--room);color:var(--ar-text);font-family:var(--face-body);font-size:1.02rem;line-height:1.35;
  padding-block:16px 24px;min-height:100%;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(ellipse 60% 40% at 50% -5%,rgba(124,92,255,.22),transparent 70%),radial-gradient(ellipse 30% 40% at 0% 100%,rgba(255,150,60,.16),transparent 70%),radial-gradient(ellipse 30% 40% at 100% 100%,rgba(255,150,60,.16),transparent 70%)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible{outline:3px solid var(--ar-gold-light);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:10px}
/* the top bar: title with its diamond rule, the party tabs */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-family:var(--face-display);font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ar-gold-light)}
.top .rule{flex:1;display:flex;align-items:center;gap:10px;min-width:60px}
.top .rule::before,.top .rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--ar-brass),transparent)}
.top .rule i{color:var(--ar-gold);font-style:normal;font-size:.9rem}
.party{display:flex;gap:4px}
.party span{font-family:var(--face-display);font-size:.62rem;letter-spacing:.16em;padding:7px 14px;border:1px solid var(--ar-brass);border-radius:4px;background:#0b0914;color:var(--ar-muted)}
.party span.on{color:var(--ar-gold-light);border-color:var(--ar-gold);box-shadow:0 0 12px rgba(201,165,92,.25)}
.snd{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ar-brass);border-radius:999px;padding:6px 14px;background:#0b0914;color:var(--ar-secondary);font-family:var(--face-display);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase}
.snd i{width:9px;height:9px;border-radius:50%;background:#3a3150;box-shadow:inset 0 0 0 1px #000}
.snd.on{color:var(--ar-gold-light);border-color:var(--ar-gold)} .snd.on i{background:var(--ar-equipped);box-shadow:0 0 8px rgba(95,208,138,.6)}
.note{font-family:var(--face-body);font-size:.9rem;letter-spacing:0;text-transform:none;color:var(--ar-muted)}
/* the panel: gold hairline, dark inner line, arcane glow */
.inv{background:linear-gradient(160deg,var(--ar-panel),var(--ar-panel2) 70%);border:1px solid var(--ar-gold);border-radius:6px;box-shadow:inset 0 0 0 1px #000,inset 0 0 0 2px rgba(201,165,92,.18),0 0 40px rgba(124,92,255,.12),0 12px 30px #000;display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:min(calc(100vh - 110px),780px);min-height:560px;overflow:hidden}
@media (max-width:860px){.inv{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);height:auto;min-height:0}.main{max-height:calc(100vh - 220px)}}
/* hero column: the painted stage, candle warmth at the edges, a violet circle under his feet */
.hero{position:relative;background:#0a0914 center/cover no-repeat;border-right:1px solid rgba(201,165,92,.35);display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,9,20,.78),rgba(10,9,20,.1) 32%,rgba(10,9,20,.15) 66%,rgba(10,9,20,.94)),radial-gradient(ellipse 60% 22% at 50% 86%,rgba(139,108,255,.55),rgba(139,108,255,.12) 55%,transparent 72%),radial-gradient(ellipse 40% 50% at 0% 70%,rgba(255,150,60,.18),transparent 70%),radial-gradient(ellipse 40% 50% at 100% 70%,rgba(255,150,60,.18),transparent 70%)}
.hero>*{position:relative}
.hero .nm{padding:16px 14px 0;display:grid;gap:3px}
.hero .nm h2{font-family:var(--face-display);font-weight:700;font-size:1.5rem;letter-spacing:.08em;color:var(--ar-gold-light);line-height:1.05;text-shadow:0 2px 6px #000}
.hero .nm .src{font-family:var(--face-body);font-size:.92rem;letter-spacing:.04em;color:var(--ar-text);text-shadow:0 1px 4px #000}
.hero .fig{display:grid;place-items:end center;padding-bottom:10px;min-height:0;overflow:hidden}
.hero .fig img{height:306px;width:130px;max-height:100%;image-rendering:pixelated;filter:drop-shadow(0 10px 10px rgba(0,0,0,.75))}   /* the x3 sheet shown at 2× — a whole-number scale, Sam's rule */
.hero .lv{display:grid;justify-items:center;gap:7px;padding:0 14px 16px}
.badge{width:60px;height:60px;border-radius:50%;border:2px solid var(--ar-gold);display:grid;place-items:center;font-family:var(--face-display);font-weight:700;font-size:1.6rem;color:var(--ar-gold-light);background:radial-gradient(circle at 50% 35%,#241e3a,#0a0914 72%);box-shadow:0 0 0 3px #0a0914,0 0 0 4px var(--ar-brass),0 0 20px rgba(201,165,92,.35)}
.badge small{font-size:.48rem;font-family:var(--face-display);letter-spacing:.14em;margin-top:-3px;color:var(--ar-secondary);font-weight:400}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;max-width:236px}
.stat > span{font-family:var(--face-display);font-weight:600;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ar-gold-light);text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.8);border:0;border-radius:0;padding:0 8px 0 34px;height:34px;background:center/100% 100% no-repeat;white-space:nowrap;font-variant-numeric:tabular-nums;position:relative;display:flex;align-items:center;justify-content:center;gap:5px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.6));min-width:0;overflow:hidden}
.stat > span b{color:#fff6dc;font-weight:700;font-size:.72rem;letter-spacing:.02em}
.stat > span.up b{color:var(--ar-equipped)}
@media (max-width:860px){.hero{min-height:0;grid-template-rows:auto;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-right:0;border-bottom:1px solid rgba(201,165,92,.35)}.hero .nm{padding:0}.hero .fig{padding:0}.hero .fig img{height:96px;width:auto;max-height:none}.hero .lv{padding:0}.hero .stat{display:none}}
/* main column */
.main{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding:16px 18px 14px;min-width:0;min-height:0}
.ttl{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid rgba(201,165,92,.3)}
.ttl h1{font-family:var(--face-display);font-weight:700;font-size:1.3rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ar-gold-light);line-height:1.1}
.ttl .sub{font-size:1rem;color:var(--ar-secondary);width:100%;font-style:italic}
.dots{margin-left:auto;display:flex;gap:7px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;border:1px solid var(--ar-brass);background:#0b0914;transform:rotate(45deg);border-radius:1px}
.dots i.on{background:var(--ar-violet);box-shadow:0 0 8px rgba(139,108,255,.7);border-color:var(--ar-gold-light)}
.dots i.done{background:var(--ar-gold);border-color:var(--ar-gold)}
.cnt{font-family:var(--face-display);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ar-gold-light);border:1px solid var(--ar-gold);border-radius:999px;padding:5px 13px;background:#0b0914;font-variant-numeric:tabular-nums}
.cnt.full{color:var(--ar-equipped);border-color:var(--ar-equipped)}
.scr{display:grid;align-content:start;gap:12px;min-width:0;overflow:auto;padding:12px 2px 4px}
/* tiles: dark, a gold hairline, the name beneath in small caps */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.tiles.wide{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{display:grid;justify-items:center;gap:6px;padding:12px 8px 10px;border:1px solid #4a3d26;border-radius:6px;background:var(--ar-inset);text-align:center;min-width:0;position:relative;box-shadow:inset 0 0 0 1px #000;transition:border-color .12s,transform .12s,box-shadow .12s}
.tile:hover{border-color:var(--ar-gold);transform:translateY(-2px);box-shadow:inset 0 0 0 1px #000,0 0 14px rgba(201,165,92,.2)}
.tile.on{border-color:var(--ar-violet);box-shadow:inset 0 0 0 1px #000,0 0 0 1px rgba(139,108,255,.5),0 0 20px rgba(139,108,255,.35)}
.tile.on .disc{box-shadow:0 0 0 1px #000,0 0 0 3px var(--ar-violet),0 0 18px rgba(139,108,255,.6)}
.tile.need{border-color:var(--ar-gold)}
.tile.need::after{content:"choose";position:absolute;top:-8px;right:8px;font-family:var(--face-display);font-size:.52rem;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:linear-gradient(#9a7dff,#5b43d6);border:1px solid var(--ar-gold);border-radius:3px;padding:1px 7px;box-shadow:0 0 0 1px #000}
.tile.done .disc{box-shadow:0 0 0 1px #000,0 0 0 2px var(--ar-equipped)}
.tile.done::after{content:"✓";position:absolute;top:6px;right:8px;color:var(--ar-equipped);font-size:.85rem}
.tile .mark{position:absolute;top:-6px;right:-6px;width:28px;height:28px;border-radius:7px;box-shadow:0 0 0 1px #000,0 2px 6px #000}
.tile.auto::after{content:"auto";position:absolute;top:-8px;right:8px;font-family:var(--face-display);font-size:.52rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ar-secondary);background:#15112a;border:1px solid var(--ar-brass);border-radius:3px;padding:1px 7px}
.tile.lock{opacity:.45;filter:saturate(.3)}
.tile.swap .disc{box-shadow:0 0 0 1px #000,0 0 0 3px var(--ar-deny),0 0 14px rgba(209,104,79,.45)}
.tile.deny{animation:shake .32s}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-3px)}100%{transform:translateX(0)}}
.disc{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,var(--deep,#241e3a),#0a0914 75%);box-shadow:0 0 0 1px #000,0 0 0 2px rgba(201,165,92,.35);color:var(--g,var(--ar-gold));transition:box-shadow .12s}
.disc svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.disc img{width:50px;height:50px;image-rendering:pixelated}
.disc.big{width:84px;height:84px} .disc.big img{width:64px;height:64px} .disc.big svg{width:42px;height:42px}
.tile .t{font-family:var(--face-display);font-weight:600;font-size:.7rem;letter-spacing:.05em;color:var(--ar-text);line-height:1.2;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.4em;overflow-wrap:anywhere}
.tile .v{font-family:var(--face-display);font-weight:700;font-size:1.3rem;color:var(--ar-gold-light);line-height:1;font-variant-numeric:tabular-nums}
.tile .v b{color:var(--ar-equipped);font-weight:700}
.tile .s{font-family:var(--face-display);font-size:.52rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ar-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile .s.k{color:var(--ar-equipped)}
.tile .cost{position:absolute;top:7px;left:8px;font-family:var(--face-display);font-size:.56rem;color:var(--ar-gold);letter-spacing:.08em}
.grp{display:grid;gap:8px}
.grp h3{font-family:var(--face-display);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ar-gold);font-weight:600;display:flex;align-items:center;gap:10px}
.grp h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--ar-brass),transparent)}
.grp h3 .lk{color:var(--ar-muted)}
/* the one line of detail — the selected row of the reference, violet-edged */
.det{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--ar-violet);border-radius:6px;background:linear-gradient(90deg,rgba(139,108,255,.08),rgba(11,9,20,.6) 60%);box-shadow:inset 0 0 0 1px #000,0 0 16px rgba(139,108,255,.18);min-height:68px}
.det.empty{border-color:#4a3d26;box-shadow:inset 0 0 0 1px #000;background:var(--ar-inset)}
.det .disc{width:46px;height:46px;flex:0 0 46px} .det .disc img{width:34px;height:34px} .det .disc svg{width:24px;height:24px}
.det .tx{min-width:0;display:grid;gap:2px}
.det .tx b{font-family:var(--face-display);font-weight:600;font-size:.95rem;color:var(--ar-gold-light);letter-spacing:.04em}
.det .tx span{font-size:.95rem;color:var(--ar-secondary);line-height:1.3}
.det .tx .src{font-family:var(--face-display);font-size:.52rem;letter-spacing:.12em;color:var(--ar-muted);text-transform:uppercase}
.det .tx .src em{font-style:normal;color:#d9a05b}
.det.empty .tx span{color:var(--ar-muted);font-style:italic}
/* ASI */
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.big{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid #4a3d26;border-radius:6px;background:var(--ar-inset);text-align:left;box-shadow:inset 0 0 0 1px #000}
.big:hover{border-color:var(--ar-gold)}
.big.on{border-color:var(--ar-violet);box-shadow:inset 0 0 0 1px #000,0 0 16px rgba(139,108,255,.3)}
.big .tx b{display:block;font-family:var(--face-display);font-weight:600;font-size:.85rem;letter-spacing:.06em;color:var(--ar-gold-light)}
.big .tx span{font-size:.95rem;color:var(--ar-secondary)}
.abil{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:640px){.abil{grid-template-columns:repeat(3,1fr)}}
.ab{display:grid;justify-items:center;gap:4px;padding:10px 4px;border:1px solid #4a3d26;border-radius:6px;background:var(--ar-inset);box-shadow:inset 0 0 0 1px #000}
.ab.on{border-color:var(--ar-violet);box-shadow:inset 0 0 0 1px #000,0 0 14px rgba(139,108,255,.3)}
.ab .k{font-family:var(--face-display);font-size:.58rem;letter-spacing:.16em;color:var(--ar-gold)}
.ab .v{font-family:var(--face-display);font-weight:700;font-size:1.5rem;color:var(--ar-text);line-height:1;font-variant-numeric:tabular-nums}
.ab .v b{color:var(--ar-equipped);font-weight:700}
.ab .m{font-family:var(--face-body);font-size:.85rem;color:var(--ar-secondary)}
.ab .pl{width:30px;height:30px;border-radius:50%;border:1px solid var(--ar-gold);color:var(--ar-gold-light);display:grid;place-items:center;font-size:1.1rem;line-height:1;margin-top:2px;background:#15112a}
.ab .pl:hover{background:rgba(139,108,255,.25);border-color:var(--ar-violet)}
/* seal + result */
.sum{display:grid;gap:10px}
.deltas{display:flex;gap:8px;flex-wrap:wrap}
.delta{display:grid;justify-items:center;gap:3px;padding:10px 14px;border:1px solid #4a3d26;border-radius:6px;background:var(--ar-inset);min-width:110px;box-shadow:inset 0 0 0 1px #000}
.delta .k{font-family:var(--face-display);font-size:.52rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ar-gold)}
.delta .v{font-family:var(--face-display);font-weight:600;font-size:1.05rem;color:var(--ar-text);font-variant-numeric:tabular-nums}
.delta .v b{color:var(--ar-equipped);font-weight:700}
.picks{display:flex;gap:10px;flex-wrap:wrap}
.pick{display:grid;justify-items:center;gap:5px;width:86px;text-align:center}
.pick .t{font-family:var(--face-display);font-weight:600;font-size:.62rem;letter-spacing:.04em;color:var(--ar-text);line-height:1.2}
.pick .s{font-family:var(--face-display);font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ar-muted)}
.result{display:grid;justify-items:center;gap:12px;text-align:center;padding:22px 10px}
.result .badge{width:96px;height:96px;font-size:2.6rem;animation:bloom .9s ease-out}
@keyframes bloom{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.result h2{font-family:var(--face-display);font-weight:700;font-size:1.4rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ar-gold-light)}
.result p{margin:0;color:var(--ar-secondary);max-width:52ch;font-size:1rem}
/* footer: BACK in gold hairline, NEXT / LEVEL UP in the reliquary's violet with a gold edge */
.foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:10px;border-top:1px solid rgba(201,165,92,.3)}
.foot .hint{flex:1;font-family:var(--face-body);font-style:italic;font-size:.9rem;color:var(--ar-muted);min-width:0}
.ghost{border:1px solid var(--ar-gold);border-radius:5px;padding:10px 20px;font-family:var(--face-display);font-weight:600;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ar-gold-light);background:#0b0914;box-shadow:inset 0 0 0 1px #000}
.ghost:hover{background:#15112a;box-shadow:inset 0 0 0 1px #000,0 0 12px rgba(201,165,92,.25)}
.lvlUp{font-family:var(--face-display);font-weight:700;font-size:.9rem;letter-spacing:.2em;text-transform:uppercase;padding:13px 36px;border:1px solid var(--ar-gold);border-radius:5px;background:linear-gradient(#9a7dff,#6c52e6 45%,#4b36b8);color:#fff6dc;text-shadow:0 1px 2px #2a1a6a;box-shadow:inset 0 0 0 1px #2a1a6a,0 0 0 2px #0a0914,0 0 22px rgba(139,108,255,.45),0 8px 16px rgba(0,0,0,.6)}
.lvlUp:hover{filter:brightness(1.08)}
.lvlUp.locked{background:linear-gradient(#2a2440,#15112a);color:var(--ar-muted);border-color:#4a3d26;text-shadow:none;box-shadow:inset 0 0 0 1px #000}
.lvlUp.ready{animation:arPulse 2.6s ease-in-out infinite}
@keyframes arPulse{0%,100%{box-shadow:inset 0 0 0 1px #2a1a6a,0 0 0 2px #0a0914,0 0 22px rgba(139,108,255,.45),0 8px 16px rgba(0,0,0,.6)}50%{box-shadow:inset 0 0 0 1px #2a1a6a,0 0 0 2px #0a0914,0 0 34px 6px rgba(139,108,255,.65),0 8px 16px rgba(0,0,0,.6)}}
details.dm{border:1px solid #2a2440;border-radius:6px;padding:8px 12px;background:#0b0914;color:var(--ar-secondary);font-size:.95rem}
details.dm summary{cursor:pointer;font-family:var(--face-display);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ar-muted)}
details.dm ul{margin:8px 0 2px;padding-left:18px;display:grid;gap:5px;max-width:78ch}
details.dm code{font-family:ui-monospace,Menlo,monospace;font-size:.78rem;color:var(--ar-gold)}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:#15112a;border:1px solid var(--ar-gold);color:var(--ar-text);padding:8px 16px;border-radius:6px;font-size:.95rem;pointer-events:none;transition:opacity .2s,transform .2s;max-width:min(90vw,520px);text-align:center;z-index:5;box-shadow:0 0 16px rgba(139,108,255,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.tile,.toast,.lvlUp.ready,.result .badge{animation:none!important;transition:none!important}.tile:hover{transform:none}}

/* the painted slabs — Sam's icon sheets (OpenArt, same recipe as the action bar), the frame is in the picture */
.slab{width:84px;height:84px;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:#0a0914;box-shadow:0 0 0 1px #000,0 4px 10px rgba(0,0,0,.6);transition:box-shadow .12s}
.slab img{width:100%;height:100%;display:block;object-fit:cover}
.slab.rune{background:radial-gradient(circle at 50% 40%,var(--deep,#241e3a),#0a0914 75%);box-shadow:0 0 0 1px #000,inset 0 0 0 2px #3a3a44,inset 0 0 0 3px #1a1a22,0 4px 10px rgba(0,0,0,.6)}
.slab.rune img{width:52px;height:52px;object-fit:contain;image-rendering:pixelated}
.tile.on .slab{box-shadow:0 0 0 1px #000,0 0 0 3px var(--ar-violet),0 0 20px rgba(139,108,255,.7)}
.tile.done .slab{box-shadow:0 0 0 1px #000,0 0 0 2px var(--ar-equipped)}
.tile.swap .slab{box-shadow:0 0 0 1px #000,0 0 0 3px var(--ar-deny),0 0 14px rgba(209,104,79,.5)}
.det .slab{width:54px;height:54px;flex:0 0 54px;border-radius:8px} .det .slab.rune img{width:34px;height:34px}
.big .slab{width:64px;height:64px;flex:0 0 64px;border-radius:9px}
.pick .slab{width:64px;height:64px;border-radius:9px}
.tiles{grid-template-columns:repeat(auto-fill,minmax(124px,1fr))}

/* HUD in the same paint: stat chips wear a small slab, the level medallion is the painted ring with the number
   printed in its empty centre, the three buttons are empty painted plates with their words set on top */
.stat > span .slab{position:absolute;left:5px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:5px;box-shadow:0 0 0 1px #000}
.medal{position:relative;width:86px;height:86px;display:grid;place-items:center}
.medal img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%}
.medal b{position:relative;font-family:var(--face-display);font-weight:700;font-size:1.9rem;color:var(--ar-gold-light);text-shadow:0 0 10px rgba(255,226,160,.7),0 2px 3px #000;line-height:1;font-variant-numeric:tabular-nums}
.medal small{position:absolute;left:0;right:0;bottom:-14px;text-align:center;font-family:var(--face-display);font-size:.5rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ar-gold)}
.hero .lv{gap:16px}
.result .medal{width:120px;height:120px;animation:bloom .9s ease-out} .result .medal b{font-size:2.8rem}
.plate{position:relative;display:inline-grid;place-items:center;min-width:150px;height:52px;padding:0 26px;background:center/100% 100% no-repeat;font-family:var(--face-display);font-weight:700;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:#fff6dc;text-shadow:0 1px 2px #1a0f3a,0 0 8px rgba(0,0,0,.6);border:0;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.plate.back{min-width:130px;color:var(--ar-gold-light);padding-left:42px}
.plate.up{min-width:210px;height:60px;font-size:.92rem}
.plate:hover{filter:drop-shadow(0 6px 10px rgba(0,0,0,.6)) brightness(1.1)}
.plate.locked{filter:grayscale(.85) brightness(.55) drop-shadow(0 6px 10px rgba(0,0,0,.6));color:var(--ar-muted);text-shadow:none}
.plate.ready{animation:platePulse 2.6s ease-in-out infinite}
@keyframes platePulse{0%,100%{filter:drop-shadow(0 6px 10px rgba(0,0,0,.6)) drop-shadow(0 0 0 rgba(139,108,255,0))}50%{filter:drop-shadow(0 6px 10px rgba(0,0,0,.6)) drop-shadow(0 0 14px rgba(139,108,255,.8))}}
.plate .ar{width:22px;height:22px;border-radius:5px;position:absolute;top:50%;transform:translateY(-50%)}
.plate.back .ar{left:10px} .plate.next .ar{right:10px}
@media (prefers-reduced-motion:reduce){.plate.ready,.result .medal{animation:none!important}}

/* the floor sigil: the sorcerer's evocation ring (public/vfx/sigilEvocationRing, Sam's art) laid flat under the hero,
   breathing quietly; LEVEL UP flares it, bursts it, and sends the picks up out of it */
.hero .fig{position:relative}
.sigil{position:absolute;left:50%;bottom:-4px;width:230px;height:230px;transform:translateX(-50%) scaleY(.34);transform-origin:50% 100%;background-repeat:no-repeat;mix-blend-mode:screen;opacity:.55;pointer-events:none;filter:drop-shadow(0 0 10px rgba(255,170,60,.6))}
.sigil.flare{animation:sigFlare 2.4s ease-out forwards}

.burst{position:absolute;left:50%;bottom:10px;width:300px;height:300px;transform:translateX(-50%);background-repeat:no-repeat;mix-blend-mode:screen;pointer-events:none}
.beam{position:absolute;left:50%;bottom:20px;width:120px;height:520px;transform:translateX(-50%) scaleY(0);transform-origin:50% 100%;background:linear-gradient(0deg,rgba(255,210,120,.0),rgba(255,210,120,.55) 20%,rgba(160,120,255,.35) 60%,transparent);filter:blur(6px);mix-blend-mode:screen;pointer-events:none;animation:beam 1.6s ease-out forwards}
@keyframes beam{0%{transform:translateX(-50%) scaleY(0);opacity:0}20%{opacity:1}45%{transform:translateX(-50%) scaleY(1)}100%{transform:translateX(-50%) scaleY(1);opacity:0}}
.fly{position:absolute;width:58px;height:58px;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px #000,0 0 18px rgba(255,210,120,.8);pointer-events:none;z-index:4}
.fly img{width:100%;height:100%;display:block}
.upicon{position:absolute;left:50%;top:22%;width:96px;height:96px;transform:translate(-50%,0) scale(.2);opacity:0;border-radius:14px;overflow:hidden;pointer-events:none;z-index:5;animation:upPop 1.9s cubic-bezier(.2,1.4,.4,1) forwards;box-shadow:0 0 30px rgba(255,210,120,.9)}

.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffe2a0;box-shadow:0 0 8px #ffcf6a;pointer-events:none;z-index:3}

@media (prefers-reduced-motion:reduce){.sigil.flare,.beam,.upicon,.hero.shake{animation:none!important}.fly,.spark{display:none}}

/* Sam's "Sorcerer Awakening — Bright Runes v3" film (960×720, 6 s, its own sound) plays over the panel when the level is taken */

    if (i >= 0){ arr.splice(i, 1); play("cancel"); } else if (arr.length >= max){ play("deny"); shake(b); toast(`${max} at this level. Tap a chosen one to take it back.`); render(); return; } else { arr.push(n); play("sorcery"); say(skillName(n)); }
    render(); return; }
  if (act === "origin"){ const o = ORIGINS.find(x => x.n === n); cur.det = n; cur.detKind = "origin"; if (!o.ok){ play("deny"); shake(b); toast(`${o.n} is in the Player's Handbook, not the SRD. It opens when the DM says so.`); render(); return; } s.origin = s.origin === n ? null : n; s.sk = []; play(s.origin ? "sorcery" : "cancel"); if (s.origin) say(n); render(); return; }
  if (act === "mode"){ s.mode = b.dataset.m; cur.det = null; play("press"); say(s.mode === "asi" ? "Ability Score Improvement" : "A feat instead"); render(); return; }
  if (act === "asi"){ const k = b.dataset.k, a = s.asi, used = Object.values(a).reduce((x, y) => x + y, 0);
    if (a[k] && used >= 2){ delete a[k]; play("cancel"); } else if (used >= 2){ play("deny"); shake(b.closest(".ab")); toast("Both points are placed. Tap − to take one back."); return; } else if (SHEET.scores[k] + (a[k] || 0) >= 20){ play("deny"); toast("Nothing above 20."); return; } else if (a[k] && Object.keys(a).length > 1){ play("deny"); shake(b.closest(".ab")); toast("+1 and +1 go to two different scores; +2 goes to one."); return; } else { a[k] = (a[k] || 0) + 1; play("orb"); }
    render(); return; }
  if (act === "feat"){ cur.det = n; cur.detKind = "feat"; s.feat = s.feat === n ? null : n; play(s.feat ? "sorcery" : "cancel"); if (s.feat) say(n); render(); return; }
  if (act === "spell"){ const x = byName(n), lv = x.level, max = RULES.maxSpell[L]; cur.det = n; cur.detKind = "spell";
    const known = lv ? preparedBefore(L).includes(n) : cantripsBefore(L).includes(n);
    if (known){ const key = lv ? "swapOut" : "swapOutC"; if (s[key] === n){ s[key] = null; play("cancel"); toast(`${n} stays.`); } else if (s.swapOut || s.swapOutC){ play("deny"); shake(b); toast("One swap per level. Tap the red one to keep it instead."); render(); return; } else { s[key] = n; play("swap"); toast(`${n} swapped out — choose one more ${lv ? "spell" : "cantrip"}.`); } render(); return; }
    if (lv > max){ play("deny"); shake(b); toast(`${ORD[lv]}-level spells open at level ${lv === 2 ? 3 : 5}.`); render(); return; }
    const list = lv ? s.picks : s.cpicks, need = lv ? needSpells(L) : needCantrips(L);
    if (list.includes(n)){ (lv ? s.picks = s.picks.filter(y => y !== n) : s.cpicks = s.cpicks.filter(y => y !== n)); play("cancel"); }
    else if (!need){ play("deny"); shake(b); toast(`Cantrips stay at ${RULES.cantrips[L]} until level 4. Tap one of yours to swap it out.`); render(); return; }
    else if (list.length >= need){ play("deny"); shake(b); toast(`${need} this level. Tap a chosen one to take it back.`); render(); return; }
    else { list.push(n); play("orb"); say(n); }
    render(); return; }
});
document.getElementById("inv").addEventListener("mouseover", e => { if (e.target.closest(".tile, .ghost, .lvlUp, .big, .pl, .plate")) hover(); });
document.getElementById("closeBtn").addEventListener("click", () => { play("close"); tell({close: true}); });
addEventListener("keydown", e => { if (e.key === "Escape" && !document.querySelector(".awaken")) tell({close: true}); });
if (!CID){ document.getElementById("scr").textContent = "No hero."; } else boot();
</script>
