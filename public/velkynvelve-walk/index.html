<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Velkynvelve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Comic+Neue:wght@700&family=Bangers&display=swap">
<style>
/* A dark play room: one full-bleed stage for the painted plate, party roster beneath.
   Single dark theme by choice, same as the plate viewer: the paintings are dark and read best on near-black. */
:root{
  color-scheme: dark;
  --room:#0b0a10; --stage:#06050a; --panel:rgba(16,14,24,.9); --panel-solid:#100e18;
  --ink:#ebe6f5; --ink-dim:#a39cb8; --rule:#2c2740;
  --ember:#e8a24a; --fungus:#62e3c6; --blood:#d0453a;
  --parch:#efe4cc; --parch-ink:#2a2018;
  --face-display:"IM Fell English SC","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --face-body:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
  --face-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --s-1:.78rem; --s0:.92rem; --s1:1.05rem; --s2:1.35rem; --s3:2rem; --s4:3.1rem;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--room);color:var(--ink);font-family:var(--face-body);font-size:var(--s0);overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:10px 16px;gap:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand h1{font-family:var(--face-display);font-weight:400;font-size:var(--s2);margin:0;letter-spacing:.02em}
.brand .sub{font-family:var(--face-mono);font-size:var(--s-1);color:var(--ink-dim);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub b{color:var(--ember);font-weight:500}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tbtn{background:none;border:1px solid var(--rule);color:var(--ink-dim);border-radius:4px;font-family:var(--face-mono);font-size:var(--s-1);letter-spacing:.06em;padding:4px 10px;cursor:pointer}
.tbtn:hover{color:var(--ink);border-color:var(--ink-dim)}
.tbtn[aria-pressed="true"],.tbtn[aria-expanded="true"]{color:var(--fungus);border-color:var(--fungus)}
input[type=range]{width:84px;accent-color:var(--fungus)}

.stage{position:relative;background:var(--stage);border:1px solid var(--rule);border-radius:6px;overflow:hidden;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.stage.pointer{cursor:pointer}
.stage.dragging{cursor:grabbing}
.world{position:absolute;left:0;top:0;width:2400px;height:1339px;transform-origin:0 0;will-change:transform;pointer-events:none}
.world img.plate{position:absolute;inset:0;width:2400px;height:1339px;max-width:none}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;image-rendering:pixelated}
.over{position:absolute;inset:0;pointer-events:none;overflow:hidden}

/* FX layer, carried over from the plate viewer */
.fx{position:absolute;inset:0;overflow:hidden}
.fx[hidden]{display:none}
.fire{position:absolute;border-radius:50%;transform:translate(-50%,-50%);mix-blend-mode:screen;background:radial-gradient(circle,rgba(255,214,140,.62) 0%,rgba(255,150,50,.30) 26%,rgba(255,110,30,.10) 50%,transparent 70%);animation:flick var(--d,1.3s) steps(1,end) infinite;animation-delay:var(--dl,0s)}
@keyframes flick{0%{opacity:.55;scale:1}9%{opacity:.9;scale:1.04}17%{opacity:.62}28%{opacity:1;scale:1.06}36%{opacity:.48;scale:.95}47%{opacity:.82}58%{opacity:.6;scale:1}66%{opacity:.95;scale:1.05}78%{opacity:.5;scale:.96}88%{opacity:.86;scale:1.02}100%{opacity:.55;scale:1}}
.cool{position:absolute;border-radius:50%;transform:translate(-50%,-50%);mix-blend-mode:screen;background:radial-gradient(circle,rgba(170,248,235,.68) 0%,rgba(110,215,235,.30) 30%,rgba(90,160,255,.10) 52%,transparent 70%);animation:pulse var(--d,4s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
@keyframes pulse{from{opacity:.3;scale:.9}to{opacity:1;scale:1.12}}
.cool.flare{animation-name:flare;animation-timing-function:ease-in-out;animation-direction:normal}
@keyframes flare{0%,62%,100%{opacity:.35;scale:.95}74%{opacity:1;scale:1.3}84%{opacity:.7;scale:1.1}}
.glint{position:absolute;transform:translate(-50%,-50%) rotate(var(--rot,0deg));mix-blend-mode:screen;background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(200,250,255,.5) 6%,transparent 14%),linear-gradient(90deg,transparent 0%,rgba(210,250,255,0) 30%,rgba(225,252,255,.9) 50%,rgba(210,250,255,0) 70%,transparent 100%) center/100% 3px no-repeat,linear-gradient(0deg,transparent 0%,rgba(210,250,255,0) 30%,rgba(225,252,255,.9) 50%,rgba(210,250,255,0) 70%,transparent 100%) center/3px 100% no-repeat;animation:glint var(--d,5s) ease-out infinite;animation-delay:var(--dl,0s);opacity:0}
@keyframes glint{0%,70%,100%{opacity:0;scale:.3}76%{opacity:1;scale:1}88%{opacity:0;scale:.6}}
.fall{position:absolute;overflow:hidden;mix-blend-mode:screen;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.fall .sheet{position:absolute;left:0;right:0;top:-512px;bottom:0;background-repeat:repeat;will-change:transform;animation:flow var(--d,1s) linear infinite}
.fall .sheet.mid{opacity:.8}
.fall .sheet.slow{opacity:.55;filter:blur(2px)}
.fall .boost{position:absolute;inset:0;background:linear-gradient(180deg,rgba(220,240,255,.35),rgba(235,248,255,.55));animation:surge 1.7s ease-in-out infinite alternate}
@keyframes flow{from{transform:translateY(0)}to{transform:translateY(512px)}}
@keyframes surge{from{opacity:.35}to{opacity:.8}}
.mist{position:absolute;border-radius:50%;transform:translate(-50%,-50%);mix-blend-mode:screen;background:radial-gradient(ellipse at center,rgba(230,242,255,.62) 0%,rgba(195,220,252,.28) 40%,transparent 70%);animation:mist var(--d,7s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
@keyframes mist{from{opacity:.45;scale:.9;translate:-4% 0}to{opacity:1;scale:1.2;translate:4% -3%}}
.spray{position:absolute;border-radius:50%;transform:translate(-50%,-50%);mix-blend-mode:screen;background:radial-gradient(circle,rgba(245,250,255,.85) 0%,rgba(215,235,255,.40) 30%,transparent 68%);animation:spray var(--d,1.6s) ease-out infinite;animation-delay:var(--dl,0s)}
@keyframes spray{0%{opacity:0;scale:.35;translate:0 0}15%{opacity:1}100%{opacity:0;scale:1.6;translate:var(--dx,0) -38%}}

/* combat: the plate blows up, edges bleed */
.vignette{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .7s ease;background:radial-gradient(ellipse at center,transparent 45%,rgba(60,0,0,.35) 75%,rgba(20,0,0,.8) 100%)}
.vignette.on{opacity:1}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s ease}
.fade.on{opacity:1}
.titlecard{position:absolute;left:50%;top:16%;transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .6s ease;text-shadow:0 2px 14px #000,0 0 3px #000}
.titlecard.on{opacity:1}
.titlecard .no{font-family:var(--face-mono);font-size:var(--s-1);letter-spacing:.2em;color:var(--ember);text-transform:uppercase}
.titlecard h2{font-family:var(--face-display);font-weight:400;font-size:clamp(1.8rem,4vw,3.2rem);margin:.1em 0 0}

/* speech bubbles: barks said in the plate or in combat */
/* comic-book speech balloons, lifted well above the speaker on a long tail so faces and the scene stay clear */
.bubble{position:absolute;transform:translate(-50%,calc(-100% - 70px));max-width:250px;background:#fffdf6;color:#14110f;
  border:2.5px solid #14110f;border-radius:48% 52% 50% 50% / 46% 48% 52% 54%;padding:12px 20px 13px;text-align:center;
  font-family:"Comic Neue","Comic Sans MS",var(--face-body);font-weight:700;font-size:.95rem;line-height:1.22;
  box-shadow:4px 4px 0 rgba(0,0,0,.45);animation:pop .18s ease-out;text-wrap:balance}
.bubble::before,.bubble::after{content:"";position:absolute;left:50%;width:0;height:0;border-style:solid}
.bubble::before{bottom:-66px;margin-left:-11px;border-width:66px 6px 0 9px;border-color:#14110f transparent transparent transparent;transform:skewX(-8deg);transform-origin:top}
.bubble::after{bottom:-58px;margin-left:-7px;border-width:60px 3px 0 6px;border-color:#fffdf6 transparent transparent transparent;transform:skewX(-8deg);transform-origin:top}
.bubble b{display:block;font-family:"Bangers","Impact",var(--face-display);font-weight:400;font-size:.9rem;letter-spacing:.06em;color:#8a1f12;margin-bottom:1px}
.bubble.foe{background:#fff1ec;border-color:#5a0d06;color:#3a0a05}
.bubble.foe::after{border-top-color:#fff1ec}
.bubble.foe b{color:#b3200f}
.bubble.said{max-width:280px}
@keyframes pop{from{opacity:0;scale:.85}to{opacity:1;scale:1}}
.tip{position:absolute;transform:translate(14px,14px);background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:4px 8px;font-size:var(--s-1);white-space:nowrap;color:var(--ink)}
.tip.locked{border-color:var(--blood)}
.nametag{position:absolute;transform:translate(-50%,6px);font-family:var(--face-mono);font-size:.68rem;letter-spacing:.06em;color:var(--ink);background:rgba(10,8,16,.75);padding:1px 6px;border-radius:3px;white-space:nowrap}

.log{position:absolute;left:12px;bottom:12px;max-width:min(460px,calc(100% - 24px));display:grid;gap:4px;pointer-events:none}
.log p{margin:0;background:var(--panel);border:1px solid var(--rule);border-radius:5px;padding:6px 10px;line-height:1.35;transition:opacity 1s ease}
.log p.old{opacity:.55}
.log p em{color:var(--ember);font-style:normal}
/* what the people around you are doing (not saying): a quiet strip in the black under the painting */
.acts{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;width:min(620px,calc(100% - 260px));display:grid;gap:2px;pointer-events:none;text-align:center}
.acts p{margin:0;font-style:italic;font-size:13px;line-height:1.35;color:#b9adc9;text-shadow:0 1px 2px #000;transition:opacity 1.2s ease}
.acts p.old{opacity:.5}
.acts p.gone{opacity:0}
.acts.over p{background:rgba(9,7,13,.78);border-radius:4px;padding:2px 10px;justify-self:center}   /* no black band: a dark backing so it reads over the painting */
@media (max-width:700px){.acts{width:calc(100% - 24px);bottom:56px}}

.zoom{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:4px}
.zoom button{width:32px;height:32px;border:0;background:transparent;color:var(--ink);font-size:1.1rem;border-radius:4px;cursor:pointer}
.zoom button:hover{background:var(--rule)}
.zoom .fit{width:auto;padding:0 10px;font-family:var(--face-mono);font-size:var(--s-1)}

.combatbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(30,10,12,.92);border:1px solid var(--blood);border-radius:6px;padding:6px 8px;max-width:calc(100% - 24px);flex-wrap:wrap;justify-content:center}
.combatbar[hidden]{display:none}
.combatbar .lbl{font-family:var(--face-display);font-size:var(--s1);color:#ff9b8f;letter-spacing:.06em;padding:0 4px}
.turns{display:flex;gap:4px;flex-wrap:wrap}
.turn{font:inherit;font-size:var(--s-1);background:transparent;color:var(--ink-dim);border:1px solid var(--rule);border-radius:999px;padding:2px 9px;cursor:pointer}
.turn.foe{color:#f0b8b0}
.turn[aria-current="true"]{color:var(--ink);border-color:var(--ember);background:rgba(232,162,74,.12)}
.turn.down{text-decoration:line-through;opacity:.5}
.combatbar .note{font-family:var(--face-mono);font-size:.66rem;color:var(--ink-dim);flex-basis:100%;text-align:center}

/* dialogs and the DM drawer */
.dialog{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);padding:16px}
.dialog[hidden]{display:none}
.card{background:var(--panel-solid);border:1px solid var(--rule);border-radius:8px;padding:18px 20px;max-width:440px;width:100%;display:grid;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.card h3{font-family:var(--face-display);font-weight:400;font-size:var(--s2);margin:0}
.card p{margin:0;line-height:1.45;color:var(--ink)}
.card .src{font-family:var(--face-mono);font-size:var(--s-1);color:var(--ink-dim)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:5px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--ember);color:var(--ember)}
.btn.primary{border-color:var(--ember);color:var(--ember)}
.btn.danger{border-color:var(--blood);color:#ff9b8f}

.dm{position:absolute;top:10px;right:12px;width:min(300px,calc(100% - 24px));background:var(--panel-solid);border:1px solid var(--rule);border-radius:8px;padding:12px;display:grid;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.dm[hidden]{display:none}
.dm h4{margin:0;font-family:var(--face-mono);font-size:var(--s-1);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);font-weight:500}
.dm select{font:inherit;background:var(--stage);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:6px}
.dm .btn{text-align:left}

/* talk: hand off to the dashboard */
.talk{position:absolute;inset:auto 0 18px 0;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.talk[hidden]{display:none}
.tcard{pointer-events:auto;width:min(560px,100%);background:var(--panel-solid);border:1px solid var(--ember);border-radius:10px;display:grid;grid-template-columns:120px 1fr;gap:14px;padding:14px;box-shadow:0 16px 50px rgba(0,0,0,.7);animation:slide .3s ease-out}
@keyframes slide{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.tcard .who{display:grid;gap:6px;justify-items:center;align-content:start}
.tcard canvas{width:112px;height:112px;image-rendering:pixelated;background:radial-gradient(circle at 50% 62%,#24203a,#0b0a10);border:1px solid var(--rule);border-radius:8px}
.tcard .name{font-family:var(--face-display);font-size:var(--s1);text-align:center;line-height:1.05}
.tcard .story{display:grid;gap:8px;align-content:start;min-width:0}
.tcard .narr{margin:0;color:var(--ink-dim);font-style:italic;line-height:1.4}
.tcard .said{margin:0;font-size:var(--s1);line-height:1.4}
.tcard .thinking{color:var(--ink-dim);font-family:var(--face-mono);font-size:var(--s-1);letter-spacing:.08em}

footer.party{display:flex;gap:8px;overflow-x:auto;min-width:0;align-items:stretch}
.pc{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--stage);border:1px solid var(--rule);border-radius:6px;padding:4px 10px 4px 4px;cursor:pointer;color:var(--ink-dim);font:inherit}
.pc canvas{width:44px;height:44px;image-rendering:pixelated}
.pc .nm{display:grid;text-align:left;line-height:1.15}
.pc .nm b{color:var(--ink);font-weight:500}
.pc .nm small{font-family:var(--face-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase}
.pc[aria-pressed="true"]{border-color:var(--ember)}
.pc[aria-pressed="true"] small{color:var(--ember)}
.help{margin-left:auto;align-self:center;font-family:var(--face-mono);font-size:var(--s-1);color:var(--ink-dim);white-space:nowrap;padding-left:8px}
button:focus-visible,select:focus-visible{outline:2px solid var(--fungus);outline-offset:2px}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--face-mono);color:var(--ink-dim);letter-spacing:.1em}

/* drow ward sigil cut into the pen wall: a dark chiselled groove (multiplied into the rock), a faint lip of lantern light,
   and violet light living inside the grooves that breathes, with runes shimmering in turn */
.marks{position:absolute;inset:0;pointer-events:none}
.ward{position:absolute;transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scaleX(var(--sx,1)) skewY(var(--sk,0deg))}
.ward svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ward.groove{mix-blend-mode:multiply;opacity:.85}
.ward.light{mix-blend-mode:screen}
.ward .bloom{position:absolute;inset:-20%;border-radius:50%;background:radial-gradient(circle,rgba(170,110,255,.14) 0%,rgba(140,80,230,.05) 45%,transparent 70%);animation:wardbreath 6.5s ease-in-out infinite}
.ward .glow{animation:wardbreath 6.5s ease-in-out infinite}
.ward .lines{animation:wardbreath 6.5s ease-in-out infinite}
.ward .rune{animation:rune 7s ease-in-out infinite;animation-delay:var(--rd,0s)}
.ward .core{animation:wardcore 6.5s ease-in-out infinite}
@keyframes wardbreath{0%,100%{opacity:.4}50%{opacity:.66}}
@keyframes rune{0%,70%,100%{opacity:.3}80%{opacity:1}}
@keyframes wardcore{0%,100%{opacity:.45}50%{opacity:.95}}
.ward.flicker .lines,.ward.flicker .glow{animation:none;opacity:.08}
.marks.still *{animation:none!important}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));background:var(--panel);border:1px solid var(--ember);color:var(--ink);border-radius:6px;padding:8px 14px;line-height:1.4;text-align:center;pointer-events:none;animation:fadein .2s ease}
.toast[hidden]{display:none}
.cool.violet{background:radial-gradient(circle,rgba(225,200,255,.62) 0%,rgba(175,130,255,.28) 30%,rgba(140,100,255,.10) 52%,transparent 70%)}
@media (max-width:700px){
  .brand .sub{max-width:44vw}
  .tcard{grid-template-columns:84px 1fr}
  .tcard canvas{width:80px;height:80px}
  .help{display:none}
  .log{bottom:58px}
  input[type=range]{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>Velkynvelve</h1><span class="sub" id="areaSub">Area <b id="areaNo">11</b> · <span id="areaName">Slave Pen</span></span></div>
    <div class="tools">
      <button class="tbtn" id="musicBtn" aria-pressed="true" title="Music (M)">♪ Music on</button>
      <input type="range" id="vol" min="0" max="100" value="40" aria-label="Music volume">
      <button class="tbtn" id="motionBtn" aria-pressed="true">Motion on</button>
      <button class="tbtn" id="dmBtn" aria-expanded="false">DM tools</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="world" id="world">
      <img class="plate" id="plate" alt="">
      <img class="plate" id="plate2" alt="" hidden>
      <div class="marks" id="marks"></div>
      <div class="fx" id="fx"></div>
    </div>
    <canvas id="cv"></canvas>
    <div class="vignette" id="vignette"></div>
    <div class="over" id="over"></div>
    <div class="fade" id="fade"></div>
    <div class="toast" id="toast" hidden></div>
    <div class="titlecard" id="titlecard"><div class="no" id="tcNo"></div><h2 id="tcName"></h2></div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="acts" id="acts" aria-live="polite"></div>
    <div class="zoom">
      <button id="zOut" aria-label="Zoom out">−</button>
      <button class="fit" id="zFit">Fit</button>
      <button id="zIn" aria-label="Zoom in">+</button>
    </div>
    <div class="combatbar" id="combatbar" hidden>
      <span class="lbl">Combat</span>
      <div class="turns" id="turns"></div>
      <button class="btn" id="nextTurn">Next turn</button>
      <button class="btn danger" id="endCombat">End combat</button>
      <div class="note">Turn order is a placeholder. Initiative, hits and damage come from the DM core.</div>
    </div>
    <div class="dm" id="dm" hidden>
      <h4>Jump to area</h4>
      <select id="jump" aria-label="Jump to area"></select>
      <h4>World</h4>
      <button class="btn" id="dmGate">Open the pen gate (Jorlan's gambit)</button>
      <button class="btn" id="dmCombat">Start a fight here</button>
      <button class="btn" id="dmTalk">An NPC wants to talk</button>
      <button class="btn" id="dmBark">Make an NPC comment</button>
      <button class="btn" id="dmReset">Reset ambushes</button>
    </div>
    <div class="dialog" id="dialog" hidden><div class="card" role="dialog" aria-modal="true" aria-labelledby="dlgTitle"><h3 id="dlgTitle"></h3><p id="dlgBody"></p><div class="src" id="dlgSrc"></div><div class="btns" id="dlgBtns"></div></div></div>
    <div class="talk" id="obj" hidden>
      <div class="tcard" role="dialog" aria-labelledby="objWho">
        <div class="who"><canvas id="objPic" width="128" height="128"></canvas><div class="name" id="objWho"></div></div>
        <div class="story"><p class="narr" id="objText"></p><div class="btns" id="objBtns"></div></div>
      </div>
    </div>
    <div class="talk" id="talk" hidden>
      <div class="tcard" role="dialog" aria-labelledby="talkWho">
        <div class="who"><canvas id="talkPortrait" width="128" height="128"></canvas><div class="name" id="talkWho"></div></div>
        <div class="story">
          <div id="talkLine"></div>
          <div class="btns">
            <a class="btn primary" id="talkGo" href="https://ashes.playacartagena.com" target="_blank" rel="noopener">Talk</a>

    <polygon points="${oct}"/><circle cx="${C}" cy="${C}" r="36"/>

function drawDoor(){

  const W2 = {x: W.x * Math.cos(a) + N.x * Math.sin(a), y: W.y * Math.cos(a) + N.y * Math.sin(a)};

  const det = W.x * H.y - W.y * H.x, ia = H.y / det, ib = -W.y / det, ic = -H.x / det, id = W.x / det;

  const ox = L.hb[0] - door.bx, oy = L.hb[1] - door.by;
  ctx.transform(A, B, C, D, L.hb[0] - (A * ox + C * oy), L.hb[1] - (B * ox + D * oy));

  ctx.restore();
}

let turnOrder = [], turnIdx = 0, combatBusy = false;

function startCombat(foeIds, label){

  hoverZone = null; tip.hidden = true;
  const pc = party.reduce((s, p) => ({x: s.x + p.x / party.length, y: s.y + p.y / party.length}), {x: 0, y: 0});
  let dir;
  if (foeIds.length && typeof foeIds[0] === "object"){ const fc = foeIds.reduce((s, f) => ({x: s.x + f.x / foeIds.length, y: s.y + f.y / foeIds.length}), {x: 0, y: 0}); dir = norm({x: fc.x - pc.x, y: fc.y - pc.y}); }

    const slot = nearestWalkable(L.x - dir.x * back * sc + perp.x * k * 85 * sc, L.y - dir.y * back * sc + perp.y * k * 85 * sc, placed); placed.push(slot);
    f.path = findPath(f, slot);
  });

    const k = i - (foeIds.length - 1) / 2;
    let f, start;
    if (typeof id === "object"){                 // someone already on the plate turns hostile
      f = id; f.kind = "foe"; f.alpha = 1; f.hostile = false; f.path = []; stopActivity(f); start = {x: f.x, y: f.y};
      npcs = npcs.filter(n => n !== f);
    } else {

      f = mkActor(id, start.x, start.y, "foe", {alpha: 0, hp: 1});
    }

  const xs = all.map(a => a.x), ys = all.map(a => a.y);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2 - 40;
  const r = stage.getBoundingClientRect(), spanX = Math.max(...xs) - Math.min(...xs) + 500, spanY = Math.max(...ys) - Math.min(...ys) + 420;
  const z = Math.max(1.4, Math.min(2.4, Math.min(r.width / (spanX * base), r.height / (spanY * base))));
  camTo(z, cx, cy, 900);
  $("vignette").classList.add("on"); setTrack("combat");
  turnOrder = [...party, ...foes]; turnIdx = 0; $("combatbar").hidden = false; renderTurns();
  log(`<em>${esc(label || "Steel comes out.")}</em>`);
  setTimeout(() => foes.forEach((f, i) => setTimeout(() => { const b = FOE_BARK[f.id]; if (b && actors.includes(f)) bark(f, b[i % b.length], 2600); }, i * 500)), 700);
}
function renderTurns(){

    b.textContent = SHORT[a.id] || SPR[a.id].json.name; b.setAttribute("aria-current", String(i === turnIdx));

function nextTurn(){

  renderTurns();

}
function attack(att, tgt, done){
  combatBusy = true;
  const sc = actorScale(tgt), reach = 70 * sc * (SPR[tgt.id].json.cell[0] / 128) + 40 * actorScale(att);
  const d = Math.hypot(tgt.x - att.x, tgt.y - att.y);
  const strike = () => {
    att.face = faceOf(tgt.x - att.x, tgt.y - att.y);
    playOnce(att, "attack", () => { setAnim(att, "idle"); combatBusy = false; done && done(); });
    att.once && (att.once.hit = () => { tgt.flash = now + 220; tgt.flashCol = att.kind === "foe" ? "#ff5040" : "#fff4d8";
      if (SPR[tgt.id].img.dodge) playOnce(tgt, "dodge", () => setAnim(tgt, "idle")); });
  };
  if (d <= reach + 10){ strike(); return; }
  const k = (d - reach) / d, goal = nearestWalkable(att.x + (tgt.x - att.x) * k, att.y + (tgt.y - att.y) * k);
  att.path = findPath(att, goal); att.onArrive = strike;

}

  if (!tgt) return;
  setTimeout(() => { if (mode === "combat" && actors.includes(f)) attack(f, tgt, () => { const b = FOE_BARK[f.id]; if (b && Math.random() < .5) bark(f, b[1], 1800); }); }, 350);
}
function endCombat(){

// they would know it, otherwise by race or a gesture); it is said in a balloon and a small card offers Talk / Decline.
const PCS = {kenta: {name: "Kenta", race: "half-elf", cls: "sorcerer"}, samson: {name: "Samson", race: "human", cls: "cleric"},
  scott: {name: "Scott", race: "half-elf", cls: "bard"}, freia: {name: "Fifi of Copperas Cove", race: "human", cls: "rogue"}};   // live characters table, 2026-10-11

  eldeth: "Eldeth Feldrun, a shield dwarf scout; loyal", stool: "Stool, a myconid sprout who speaks only through telepathic rapport spores",
  sarith: "Sarith Kzekarit, a drow prisoner", buppido: "Buppido, a derro", derendil: "Prince Derendil, a quaggoth who believes he is a cursed elf prince",
  topsy: "Topsy, a deep gnome twin", turvy: "Turvy, a deep gnome twin", jimjar: "Jimjar, a deep gnome gambler",
  ront: "Ront, a cowardly orc bully", shuushar: "Shuushar the Awakened, a pacifist kuo-toa"};

async function npcOpening(npc){
  const nm = SPR[npc.id].json.name, pc = PCS[leader.id] || {name: SHORT[leader.id] || "the prisoner", race: "", cls: ""};

    } catch (e) {}

// Spoken aloud. This page can't reach ElevenLabs, so it uses the browser's own voices, matched roughly to the
// speaker; inside the game the same line goes through /api/npc-tts and Eldeth gets her canon ElevenLabs voice.
const VOICE = {eldeth: {f: true, pitch: .85, rate: .95}, topsy: {f: true, pitch: 1.35, rate: 1.08}, turvy: {f: false, pitch: 1.3, rate: 1.08},
  jimjar: {f: false, pitch: 1.25, rate: 1.1}, ront: {f: false, pitch: .6, rate: .95}, derendil: {f: false, pitch: .75, rate: .9},
  sarith: {f: false, pitch: .9, rate: .9}, buppido: {f: false, pitch: 1.15, rate: 1.0}, shuushar: {f: false, pitch: .8, rate: .85},
  jorlan: {f: false, pitch: .8, rate: .95}};
let speaking = false;
let voiceAudio = null;
async function speakCanon(id, text){         // the game's ElevenLabs route: canon voices by NPC name (Eldeth, Ront...)
  const res = await fetch("/api/npc-tts", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({text, npcName: SPR[id].json.name})});
  if (!res.ok) throw new Error("tts " + res.status);
  // WebAudio, not an <audio> element: the game found <audio> silently mute in some Chromium builds.
  const ctx = audioCtx();
  // An NPC can start talking on their own, with no click behind it, and a suspended context would
  // swallow the line. The first click or key anywhere wakes it (see wakeAudio); give that a moment.
  if (ctx.state !== "running") await Promise.race([ctx.resume().catch(() => {}), wait(1500)]);
  if (ctx.state !== "running") throw new Error("audio locked");
  const buf = await ctx.decodeAudioData(await res.arrayBuffer());
  if (voiceAudio) try { voiceAudio.stop(); } catch (e) {}
  const src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination);
  src.onended = () => { speaking = false; }; speaking = true; src.start(); voiceAudio = src;
}
function speak(id, text){
  if (APP){ speakCanon(id, text).catch(() => speakBrowser(id, text)); return; }
  speakBrowser(id, text);
}
function speakBrowser(id, text){
  try {
    const ss = window.speechSynthesis; if (!ss) return;
    ss.cancel();
    const v = VOICE[id] || {f: false, pitch: 1, rate: 1};
    const u = new SpeechSynthesisUtterance(text);
    const voices = ss.getVoices().filter(x => /^en/i.test(x.lang));
    const fem = /female|samantha|victoria|karen|moira|tessa|fiona|zira|susan|serena|libby|sonia|hazel|aria|jenny/i;
    u.voice = voices.find(x => v.f ? fem.test(x.name) : !fem.test(x.name)) || voices[0] || null;
    u.pitch = v.pitch; u.rate = v.rate; u.volume = 1;
    u.onstart = () => { speaking = true; }; u.onend = u.onerror = () => { speaking = false; };
    ss.speak(u);
  } catch (e) {}
}
// Who starts it matters (Sam, 2026-10-11): someone who wants a word speaks first, here and again on the

      if (d > 0 && d < min){ const push = Math.min(4, (min - d) / 2), ux = dx / d, uy = dy / d;
        if (!b.once && walkable(b.x + ux * push, b.y + uy * push)){ b.x += ux * push; b.y += uy * push; }
        if (!a.once && walkable(a.x - ux * push, a.y - uy * push)){ a.x -= ux * push; a.y -= uy * push; } }
    }
  }
  if (mode === "combat" && !combatBusy) keyboardMove(activeActor(), dt);
  // idle life: whoever you're not moving potters about, like at camp
  if (mode === "explore") for (const a of [...party, ...npcs]) idleLife(a);
}
let lastT = performance.now();
function frame(t){
  now = t; const dt = Math.min(.05, (t - lastT) / 1000); lastT = t;
  if (mode !== "load"){ update(dt); draw(); updateOverlay(); }
  tickMusic(dt);
  requestAnimationFrame(frame);
}

// ---------- boot ----------
(async () => {
  setMotion(motionOn);
  resize();
  try { await loadSprites(); } catch (e) { $("loading").textContent = "Could not load sprite: " + e; return; }
  $("loading").remove();
  leader = null;
  const saved = APP ? loadWalk() : null;
  if (saved){
    Object.assign(state, saved.state || {});
    const L = saved.party.find(p => p.id === saved.leader) || saved.party[0];
    leader = {id: L.id};
    await enterNode(saved.cur, {spawn: {x: L.x, y: L.y}, offs: saved.party.map(p => ({id: p.id, dx: p.x - L.x, dy: p.y - L.y}))});
    for (const p of party){ const s = saved.party.find(q => q.id === p.id); if (s){ p.x = s.x; p.y = s.y; p.face = s.face || 0; p.home = {x: s.x, y: s.y}; } }
  } else {
    await enterNode(11, {spawn: {x: 1560, y: 960}, note: "You wake in the slave pen. The gate is locked. <em>DM tools</em> can open it, or jump the party anywhere."});
  }
  requestAnimationFrame(frame);
})();
</script>
