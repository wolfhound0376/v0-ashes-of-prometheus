<!doctype html>

<title>The Road — Ashes of Prometheus</title>
<!--
  THE PIXEL ROAD (pilot, look only).

  Sam, 2026-11-22: "We should make a hybrid where a token of the party and main characters with the party tightly
  behind move through the pixel map until there is an encounter and then it moves into the painted plates."
  And: "The plates can also be areas of interest, traders, special terrain features."

  This page is step 1 of claude/Pixel_Road_Hybrid_2026-11-22.md: ONE stretch of road, drawn from a PixelLab tile
  map, with the leader walking it and the party tight behind. It reads nothing from the game and writes nothing
  to it: no march, no meetings, no fights, no plates yet. Those are steps 2 and 3.

  Where the party can walk is not painted by hand. It comes with the map: road.json carries the map's own grid
  of cells (floor / rock / cliff face / stream) and each prop's footprint, and the page walks on that.

  SOUND (Sam, 2026-11-23: "Where is the horror, underdark DND sound ... we have a number of tracks we can use from
  my library"). The road sounds the way the travel map's road already does (public/underdark-map/index.html), with
  the same files and the same levels, nothing new: the library's Cavern of Lost Souls for music, the tunnel bed
  under it, boots on stone while the party moves, and the water bed rising as they near the stream. It starts on
  the first click or key, as browsers require. /test-copy-silence.js is the first script, so a preview copy stays
  silent until Sam turns its sound on with the pill in the corner. M turns the music off and on.

  Open it:  /pixel-road/index.html            (or the DM's door, /rehearsal?to=road)
            ?line=kenta,freia,scott           who walks, leader first (sprite slugs in /sprites)
            ?light=0                          the cave drawn fully lit, no darkness or glow
            ?fg=0                             without the near rock (ceiling and shelf) in front
            ?road=road-01                     which stretch
            ?sound=0                          no sound at all
-->
<script src="/test-copy-silence.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  html,body{margin:0;height:100%;background:#07060b;overflow:hidden;touch-action:none}
  canvas{display:block;width:100vw;height:100vh;cursor:pointer}
  #plate{position:fixed;inset:0;background:#07060b;opacity:0;pointer-events:none;transition:opacity .9s ease}
  #plate.on{opacity:1;pointer-events:auto}
  #plate img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;display:block}
  #plate .card{position:absolute;left:50%;bottom:6vh;transform:translateX(-50%);width:min(620px,86vw);padding:20px 26px 22px;text-align:center;
    background:linear-gradient(rgba(14,13,22,.93),rgba(8,7,13,.95));border:1px solid #6b5a3a;box-shadow:0 0 0 1px #000,0 12px 40px rgba(0,0,0,.7);border-radius:4px}
  #plate .name{font:600 15px Cinzel,Georgia,serif;letter-spacing:.34em;text-transform:uppercase;color:#c9a96a}
  #plate .ask{margin:.55em 0 .95em;font:italic 21px 'Crimson Text',Georgia,serif;color:#e9dcc6;line-height:1.35}
  #plate .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  #plate button{min-width:190px;padding:11px 18px;font:600 14px Cinzel,Georgia,serif;letter-spacing:.14em;text-transform:uppercase;color:#e9dcc6;cursor:pointer;
    background:linear-gradient(#2a2433,#17131e);border:1px solid #8a7446;border-radius:3px}
  #plate button:hover,#plate button:focus-visible{background:linear-gradient(#3a3147,#211b2b);border-color:#d9bd7c;color:#fff;outline:none}
  #plate button .lbl{pointer-events:none}
  /* REST (Sam, 2026-11-23). Two small buttons while walking, and the scene they open. */
  #restbar{position:fixed;right:14px;bottom:14px;display:flex;gap:8px;z-index:5;opacity:.72;transition:opacity .3s}
  #restbar:hover,#restbar:focus-within{opacity:1}

    background:rgba(11,8,16,.92);border:1px solid rgba(214,176,98,.5);border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.6);color:#e9dcc6;animation:sayin .35s ease-out}
  #say[hidden]{display:none}

  #say .who{font:600 12px Cinzel,Georgia,serif;letter-spacing:.2em;text-transform:uppercase;color:#d9bd7c}
  #say .line{font:17px/1.35 "Crimson Text",Georgia,serif;margin-top:2px}

    background:rgba(16,13,22,.82);border:1px solid #6b5a3a;border-radius:3px}

  #rest .kick{font:600 12px Cinzel,Georgia,serif;letter-spacing:.42em;text-transform:uppercase;color:#c9a96a}
  #rest .title{margin-top:.35em;font:600 30px Cinzel,Georgia,serif;letter-spacing:.14em;text-transform:uppercase;color:#f0e4c8;text-shadow:0 2px 10px #000}
  #rest .lore{margin:.9em auto 0;max-width:640px;font:italic 17px 'Crimson Text',Georgia,serif;color:#cfc3ab;min-height:2.8em}
  #rest .lore b{font-style:normal;color:#e9dcc6}
  #rest .dots i{display:inline-block;width:6px;height:6px;margin:14px 4px 0;border-radius:50%;background:#c9a96a;animation:rdot 1.2s infinite ease-in-out}

  @keyframes rdot{0%,80%,100%{opacity:.2}40%{opacity:1}}
  @media (prefers-reduced-motion:reduce){#rest .dots i{animation:none}}

<body>
<canvas id="c"></canvas>
<div id="restbar" hidden><button type="button" data-rest="short" title="An hour by a small fire"><span class="lbl">Short rest</span></button><button type="button" data-rest="long" title="Make camp for a long rest"><span class="lbl">Make camp</span></button></div>
<div id="rest" role="status" aria-live="polite"><img class="pit" alt=""><img class="load" alt=""><canvas></canvas><div class="txt"><div class="kick"></div><div class="title"></div><div class="lore"></div><div class="dots" hidden><i></i><i></i><i></i></div></div></div>
<div id="say" hidden><canvas width="64" height="64"></canvas><div class="w"><div class="who"></div><div class="line"></div><div class="note"></div><div class="row"></div></div></div>
<div id="plate"><img alt=""><div class="card"><div class="name"></div><div class="ask"></div><div class="row"></div></div></div>
<script>
"use strict";
const Q = new URLSearchParams(location.search);
const ROAD_ID = (Q.get("road") || "road-01").replace(/[^a-z0-9-]/gi, "");
const BASE = "/pixel-road/" + ROAD_ID + "/";
const LIGHT = Q.get("light") !== "0";
// Everyone who has a walking sprite of their own (lib/travel/map-hero.ts). Leader first.
const LINE = (Q.get("line") || "kenta,freia,scott,samson,lynkes,gandalf,kingasaur").split(",").map(s => s.trim().replace(/[^a-z0-9-]/gi, "")).filter(Boolean).slice(0, 7);
// THE REAL MARCH (Sam, 2026-11-23: "Pixel road part of the real march"). The travel map lays this page over itself
// for each leg of a march (components/map/underdark-map-module.tsx) with ?embed=1: who walks comes from the game
// (`line` heroes, `npcs` companions), the two ends are named for the markers (`from`, `to`), and reaching the far
// end tells the map, which then moves the party on the nodal map and rolls what waits there. This page still
// decides nothing: it shows, and it reports.
const EMBED = Q.get("embed") === "1" && window.parent !== window;
const clean = (v, n) => String(v || "").replace(/[^A-Za-z0-9' ,.\-]/g, "").trim().slice(0, n);
const NPCS = EMBED ? (Q.get("npcs") || "").split(",").map(s => s.trim().replace(/[^a-z0-9-]/gi, "")).filter(Boolean).slice(0, 10) : [];
const tell = (m) => { if (EMBED) try { window.parent.postMessage(m, location.origin); } catch (e) {} };
let leaving = false;
// Lynkes stands as tall as Fifi (Sam, 2026-11-12); his manifest's ppu is not his real height (lib/travel/map-hero.ts).
const PPU_FIX = { lynkes: 155 };
// The eight facings, in the row order of every sheet (lib/sprite-token.ts): S, SE, E, NE, N, NW, W, SW.
const rowFor = (dx, dy) => (2 - Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) + 16) % 8;

const SPEED = 92;        // world pixels a second (a 32px cell is 5 ft)
const GAP = 17;          // how far behind the one in front each follower walks: tight, per Sam
const FACE_LIP = 14;      // how far a rock face hangs down into the floor cell below it
const FOOT_RX = 7, FOOT_RY = 3; // a figure's footprint on the ground, for bumping into things

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const img = (src) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });

let road = null, ground = null, shade = null, front = null, fgImg = {}, WALK = "w", objImg = {}, heroes = [], trail = [], path = [], keys = {}, cam = { x: 0, y: 0, z: 3 }, last = 0, lightCv = null;

/* ---------- where the party can walk: the map's own cells, minus each prop's footprint ---------- */
function cellAt(px, py) {
  const c = Math.floor(px / road.tile), r = Math.floor(py / road.tile);
  if (r < 0 || c < 0 || r >= road.rows || c >= road.cols) return "d";
  return road.grid[r][c];
}
function solidAt(px, py) {
  if (!WALK.includes(cellAt(px, py))) return true;
  // A rock face is painted half a cell lower than its cell (the tiles sit on the corners of the grid), so the top
  // of the floor cell under one is still wall to the eye. Nobody stands there.
  if (cellAt(px, py - FACE_LIP) === "a") return true;
  for (const o of road.objects) { const g = o.ground; if (px >= g[0] && px <= g[0] + g[2] && py >= g[1] && py <= g[1] + g[3]) return true; }
  return false;
}
function canStand(x, y) {
  return !solidAt(x - FOOT_RX, y) && !solidAt(x + FOOT_RX, y) && !solidAt(x, y - FOOT_RY) && !solidAt(x, y + FOOT_RY) && !solidAt(x, y);
}

/* ---------- finding a way: a half-cell grid, eight directions, no cutting corners ---------- */
const STEP = 16;
function findPath(fx, fy, tx, ty) {
  const W = Math.ceil(road.cols * road.tile / STEP), H = Math.ceil(road.rows * road.tile / STEP);
  const node = (x, y) => [Math.max(0, Math.min(W - 1, Math.round((x - STEP / 2) / STEP))), Math.max(0, Math.min(H - 1, Math.round((y - STEP / 2) / STEP)))];
  const pos = (i, j) => [i * STEP + STEP / 2, j * STEP + STEP / 2];
  const ok = (i, j) => i >= 0 && j >= 0 && i < W && j < H && canStand(...pos(i, j));
  const [si, sj] = node(fx, fy);
  let [ti, tj] = node(tx, ty);
  if (!ok(ti, tj)) { // a click on rock or a prop: go to the nearest ground you can stand on
    let best = null;
    for (let r = 1; r <= 8 && !best; r++) for (let j = tj - r; j <= tj + r; j++) for (let i = ti - r; i <= ti + r; i++) {
      if (!ok(i, j)) continue; const d = (i - ti) ** 2 + (j - tj) ** 2; if (!best || d < best[2]) best = [i, j, d];
    }
    if (!best) return []; [ti, tj] = best;
  }
  const key = (i, j) => j * W + i, came = new Map(), cost = new Map([[key(si, sj), 0]]);
  const open = [[0, si, sj]];
  while (open.length) {
    let b = 0; for (let k = 1; k < open.length; k++) if (open[k][0] < open[b][0]) b = k;
    const [, i, j] = open.splice(b, 1)[0];
    if (i === ti && j === tj) break;
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
      if (!di && !dj) continue; const ni = i + di, nj = j + dj;
      if (!ok(ni, nj)) continue; if (di && dj && (!ok(i + di, j) || !ok(i, j + dj))) continue;
      const c = cost.get(key(i, j)) + (di && dj ? 1.4142 : 1);
      if (c < (cost.get(key(ni, nj)) ?? Infinity)) { cost.set(key(ni, nj), c); came.set(key(ni, nj), [i, j]); open.push([c + Math.hypot(ti - ni, tj - nj), ni, nj]); }
    }
  }
  if (!came.has(key(ti, tj)) && !(si === ti && sj === tj)) return [];
  const out = []; let cur = [ti, tj];
  while (cur && !(cur[0] === si && cur[1] === sj)) { out.unshift(pos(cur[0], cur[1])); cur = came.get(key(cur[0], cur[1])); }
  return out;
}

/* ---------- the party ---------- */
async function loadHero(slug) {
  try {
    const m = await (await fetch("/sprites/" + slug + "/sprite.json")).json();
    const a = m.animations || {}; if (!a.walk || !a.idle) return null;
    const cell = Array.isArray(m.cell) ? m.cell[0] : 128, piv = Array.isArray(m.pivot) ? m.pivot : [cell / 2, cell];
    const ppu = PPU_FIX[slug] || m.ppu || 96;
    const [walk, idle] = await Promise.all([img("/sprites/" + slug + "/" + a.walk.sheet), img("/sprites/" + slug + "/" + a.idle.sheet)]);
    if (!walk || !idle) return null;
    return { slug, cell, piv, s: road.tile / ppu, walk: { im: walk, n: a.walk.frames, fps: a.walk.fps || 8 }, idle: { im: idle, n: a.idle.frames, fps: a.idle.fps || 5 }, x: 0, y: 0, row: 2, moving: false, t: Math.random() * 3 };
  } catch { return null; }
}
function drawHero(h) {
  const a = h.moving ? h.walk : h.idle, f = Math.floor(h.t * a.fps) % a.n, w = h.cell * h.s;
  ctx.globalAlpha = 0.32; ctx.fillStyle = "#000"; ctx.beginPath(); ctx.ellipse(h.x, h.y, w * 0.17, w * 0.06, 0, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  ctx.drawImage(a.im, f * h.cell, h.row * h.cell, h.cell, h.cell, h.x - h.piv[0] * h.s, h.y - h.piv[1] * h.s, w, w);
}

/* ---------- moving ---------- */
function stepLeader(dt) {
  const L = heroes[0]; let vx = 0, vy = 0;
  const kx = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0), ky = (keys.ArrowDown || keys.s ? 1 : 0) - (keys.ArrowUp || keys.w ? 1 : 0);
  if (kx || ky) { path = []; const n = Math.hypot(kx, ky); vx = kx / n; vy = ky / n; }
  else if (path.length) {
    const [tx, ty] = path[0], d = Math.hypot(tx - L.x, ty - L.y);
    if (d < SPEED * dt + 0.5) { L.x = tx; L.y = ty; path.shift(); pushTrail(); return path.length > 0; }
    vx = (tx - L.x) / d; vy = (ty - L.y) / d;
  }
  if (!vx && !vy) return false;
  const nx = L.x + vx * SPEED * dt, ny = L.y + vy * SPEED * dt; let moved = false;
  if (canStand(nx, ny)) { L.x = nx; L.y = ny; moved = true; }
  else if (canStand(nx, L.y)) { L.x = nx; moved = true; }   // slide along a wall instead of stopping dead
  else if (canStand(L.x, ny)) { L.y = ny; moved = true; }
  if (moved) { L.row = rowFor(vx, vy); pushTrail(); }
  return moved;
}
function pushTrail() {
  const L = heroes[0], p = trail[0];
  if (!p || Math.hypot(L.x - p[0], L.y - p[1]) >= 1.5) { trail.unshift([L.x, L.y]); if (trail.length > 900) trail.length = 900; }
}
// Each follower stands on the leader's own footsteps, GAP further back than the one ahead, so the line bends
// round corners the way the leader went and nobody walks through rock.
//
// The distance back is measured from where the leader IS, not from the last footstep recorded. Footsteps are only
// recorded every 1.5px, so measured from those a follower stood still on every frame that recorded none and then
// jumped on the next, and each standstill flipped it from its walk to its idle and back. On a fast screen that was
// most frames: the leader walked and everyone behind him shivered (Sam, 2026-11-23: "everyone is just vibrating
// fast"). A follower now walks whenever the leader walks, and faces the way the path runs under its own feet.
function placeFollowers(dt, leaderMoved) {
  const L = heroes[0], pts = (!trail.length || trail[0][0] !== L.x || trail[0][1] !== L.y) ? [[L.x, L.y]].concat(trail) : trail;
  for (let i = 1; i < heroes.length; i++) {
    const h = heroes[i], want = GAP * i; let acc = 0, at = pts[pts.length - 1], dir = null;
    for (let k = 1; k < pts.length; k++) {
      const ax = pts[k - 1][0], ay = pts[k - 1][1], bx = pts[k][0], by = pts[k][1], d = Math.hypot(bx - ax, by - ay);
      if (acc + d >= want) {
        const u = (want - acc) / (d || 1); at = [ax + (bx - ax) * u, ay + (by - ay) * u];
        // which way the path runs here, looked at over a few footsteps so a single kinked step cannot turn a head
        const a = pts[Math.max(0, k - 4)], b = pts[Math.min(pts.length - 1, k + 3)];
        if (Math.hypot(a[0] - b[0], a[1] - b[1]) > 2) dir = [a[0] - b[0], a[1] - b[1]];
        break;
      }
      acc += d;
    }
    h.moving = leaderMoved;
    if (leaderMoved && dir) h.row = rowFor(dir[0], dir[1]);
    h.x = at[0]; h.y = at[1];
  }
}

/* ---------- drawing ---------- */
function resize() { const r = Math.min(window.devicePixelRatio || 1, 2); cv.width = Math.round(innerWidth * r); cv.height = Math.round(innerHeight * r); }
let vista = 0; const paveImg = [];
function camera() {
  // About eight and a half cells of height on screen, whatever the window: close, so the rock and the
  // tall things in the cave stand over the figures (Sam, 2026-11-22: "more depth").
  const m = road.tile / 2, ww = road.cols * road.tile - 2 * m, wh = road.rows * road.tile - 2 * m;
  cam.z = Math.max(cv.height / (8.5 * road.tile), cv.width / ww, cv.height / wh);
  const L = heroes[0]; let cx = L.x, cy = L.y; vista = 0;
  // A VISTA (Sam, 2026-11-23, on the Ruins: "a lot larger and be part of the background ... not like a token sitting
  // in the middle of the cave"). A landmark may name a view: as the party nears it the camera eases back and up
  // until the whole of it stands behind them, and the ceiling rock in front of the lens thins out so it is not
  // hidden. It is a function of where the leader stands, so it eases in and out by itself as they walk.
  for (const k of road.landmarks || []) {
    const v = k.vista; if (!v) continue;
    const t = Math.max(0, Math.min(1, (1 - Math.hypot(L.x - k.x, L.y - k.y) / v.reach) / 0.55)), f = t * t * (3 - 2 * t);
    if (f <= vista) continue;
    vista = f; cam.z = Math.max(cam.z + (cv.height / v.h - cam.z) * f, cv.width / ww, cv.height / wh);
    cx = L.x + (v.x - L.x) * f * 0.75; cy = L.y + (v.y - L.y) * f;
  }
  const vw = cv.width / cam.z, vh = cv.height / cam.z;
  cx = Math.max(L.x - vw * 0.38, Math.min(L.x + vw * 0.38, cx)); cy = Math.max(L.y - vh * 0.34, Math.min(L.y + vh * 0.34, cy));   // the vista never loses the party off the edge
  cam.x = Math.max(m, Math.min(m + ww - vw, cx - vw / 2)); cam.y = Math.max(m, Math.min(m + wh - vh, cy - vh / 2));
}
function sign(text, x, y, near) {
  // A way out or a place of interest: a small faint name that brightens as the party nears it (Sam's pick "A"
  // on the exit signposts, 2026-11-15). No floor glow.
  const d = Math.hypot(heroes[0].x - x, heroes[0].y - y), a = 0.34 + 0.6 * Math.max(0, 1 - d / near);
  ctx.save(); ctx.globalAlpha = a; ctx.font = "600 7px Georgia, 'Times New Roman', serif"; ctx.textAlign = "center";
  ctx.lineWidth = 2; ctx.strokeStyle = "rgba(0,0,0,.85)"; ctx.fillStyle = "#e8d6a8";
  const t = text.toUpperCase().split("").join(" "); ctx.strokeText(t, x, y); ctx.fillText(t, x, y); ctx.restore();
}
function drawLight() {
  if (!lightCv) lightCv = document.createElement("canvas");
  if (lightCv.width !== cv.width || lightCv.height !== cv.height) { lightCv.width = cv.width; lightCv.height = cv.height; }
  const l = lightCv.getContext("2d"), z = cam.z, sx = (x) => (x - cam.x) * z, sy = (y) => (y - cam.y) * z;

  heroes = (await Promise.all(LINE.concat(NPCS.filter((s) => !LINE.includes(s))).map(loadHero))).filter(Boolean);
  if (EMBED) { const f = clean(Q.get("from"), 40), t = clean(Q.get("to"), 40); if (f) road.entry.label = f; if (t) road.exit.label = t; 
    // On the march a landmark is scenery: stepping into its rooms from here would leave the march half walked. The
    // Ruins are entered from the map's own card when the book's dice land on them (lib/travel/battle.ts).
    road.landmarks = []; }
  if (!ground || !heroes.length) { document.body.innerHTML = '<p style="color:#a99;font:14px Georgia;padding:2em">The road could not be drawn.</p>'; return; }
  heroes.forEach((h, i) => { h.x = road.entry.x - i * GAP; h.y = road.entry.y; });
  { let sx = 0, sy = 0, n = 0;      // the middle of the stream, for the sound of it
    road.grid.forEach((row, r) => { for (let c = 0; c < row.length; c++) if (row[c] === "s") { sx += c * road.tile + 16; sy += r * road.tile + 16; n++; } });
    if (n) waterAt = [sx / n, sy / n]; }
  let startAt = [road.entry.x, road.entry.y];
  { // BACK FROM INSIDE (?at=<landmark kind>): the party stands at that landmark's door, just outside its reach
    const at = new URLSearchParams(location.search).get("at"), m = at && (road.landmarks || []).find((k) => k.kind === at);
    if (m) for (let dy = (m.near || 70) + 56; dy < 260; dy += 6) if (canStand(m.x, m.y + dy)) { startAt = [m.x, m.y + dy]; heroes.forEach((h) => { h.x = m.x; h.y = m.y + dy; }); break; } }
  for (let i = 0; i <= heroes.length * GAP + 4; i += 1.5) trail.push([startAt[0] - (startAt[0] === road.entry.x ? i : 0), startAt[1]]);
  resize(); addEventListener("resize", resize);
  addEventListener("keydown", (e) => { soundStart(); if (resting) { e.preventDefault(); return; } if (plateOpen) { if (e.key === "Escape") plateClose(); else if (e.key === "Enter" && !plateOpen.entered) plateEnter(); e.preventDefault(); return; } if (e.key === "m" || e.key === "M") toggleMusic(); keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = true; if (e.key.startsWith("Arrow")) e.preventDefault(); });
  addEventListener("keyup", (e) => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });
  addEventListener("blur", () => { keys = {}; });
  cv.addEventListener("pointerdown", (e) => {
    soundStart();
    const r = cv.width / cv.clientWidth, wx = cam.x + e.clientX * r / cam.z, wy = cam.y + e.clientY * r / cam.z;
    path = findPath(heroes[0].x, heroes[0].y, wx, wy);
  });
  // For poking at it from the console and for a browser test. The walk check itself is lib/pixel-road.test.ts.
  window.__road = { road, heroes, plate: () => plateOpen && plateOpen.label, plateEnter, plateClose, rest, resting: () => resting && resting.kind, objImg, snd, findPath, canStand, go: (x, y) => { path = findPath(heroes[0].x, heroes[0].y, x, y); return path.length; }, idle: () => !path.length };
  requestAnimationFrame((t) => { last = t; frame(t); });
  tell({ type: "aop:road-ready", road: ROAD_ID });
})();
