<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forage Run</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --ink:#d9d4ea; --dim:#8f88a8; --line:#2b2540; --bg:#0b0914; --key:#1a1530; --accent:#5fe0d0; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family: "Silkscreen", ui-monospace, Menlo, Consolas, monospace; }
  body { display:flex; flex-direction:column; align-items:center; gap:10px; padding:10px; }
  #stage { position:relative; width:min(100%, calc((100vh - 120px) * 2)); aspect-ratio:2/1; border:1px solid var(--line); background:#05040c; }
  canvas { width:100%; height:100%; display:block; image-rendering:pixelated; image-rendering:crisp-edges; cursor:none; outline:none; }
  #help { width:min(100%, 1440px); display:flex; flex-wrap:wrap; gap:6px 18px; justify-content:center; font-size:11px; color:var(--dim); line-height:1.9; }
  #help b { font-weight:400; color:var(--ink); }
  kbd { font-family:inherit; font-size:10px; background:var(--key); border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:1px 6px; color:var(--ink); margin-right:3px; }
  #note { font-size:10px; color:var(--dim); text-align:center; max-width:1100px; line-height:1.7; }
  button { font-family:inherit; font-size:11px; color:var(--ink); background:var(--key); border:1px solid var(--line); border-radius:4px; padding:4px 10px; cursor:pointer; }
  button:hover, button:focus-visible { border-color:var(--accent); outline:none; }
#verdict,#tune,#drop,#look{display:none !important}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="960" height="480" tabindex="0" aria-label="Forage Run. Click to start."></canvas></div>
<div id="help">
  <span><kbd>A</kbd><kbd>D</kbd> or <kbd>←</kbd><kbd>→</kbd> <b>move</b></span>
  <span><kbd>Space</kbd> <b>jump / again: double jump / hold in the air: plunge</b></span>
  <span><kbd>Left click</kbd> or <kbd>J</kbd> <b>swing</b></span>
  <span><kbd>Right click</kbd> or <kbd>K</kbd> <b>throw dagger</b></span>
  <span><kbd>Middle click</kbd> or <kbd>L</kbd> <b>special, once</b></span>
  <span><kbd>Shift</kbd> <b>hold to harvest</b></span>
  <span><button id="restart" type="button">Restart room</button> <button id="music" type="button" aria-pressed="true">Sound on</button> <button id="view" type="button">View: 20 tiles</button> <button id="look" type="button">Look: Jade Lantern Marsh</button></span>
</div>
<div id="rooms" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:1100px;margin:6px auto;"></div>
<div id="verdict" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;font-size:11px;margin:6px auto;max-width:1100px;">
  <b id="roomname"></b>
  <button type="button" data-v="keep">Keep</button> <button type="button" data-v="tweak">Tweak</button> <button type="button" data-v="cut">Cut</button>
  <span id="verdicts" style="color:var(--dim)"></span>
</div>
<div id="drop" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;font-size:11px;margin:6px auto;max-width:1100px;"><b>Drop</b></div>
<div id="tune" style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center;font-size:11px;margin:6px auto;max-width:1100px;">
  <label>Fifi speed <input id="t_run" type="range" min="4" max="10" step="0.25" value="7.25"> <output id="o_run"></output> tiles/s</label>
  <label>Creature speed <input id="t_cs" type="range" min="0.5" max="2" step="0.1" value="1"> <output id="o_cs"></output>x</label>
  <label>Lamp <input id="t_lamp" type="range" min="60" max="480" step="10" value="240"> <output id="o_lamp"></output> s</label>
  <label>Walkway holds <input id="t_hold" type="range" min="0.15" max="1.5" step="0.05" value="0.5"> <output id="o_hold"></output> s</label>
</div>
<div id="note">Three levels of 640 tiles. Keys 1 to 3 pick a level.</div>
