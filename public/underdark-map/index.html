<!doctype html><html><head><script src="/test-copy-silence.js"></script><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>Underdark World Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one full-bleed 3D world map; UI floats over it in the corners, a travel card at the bottom. Single dark look on purpose (the game's own world). */
:root{
  --ink:#06040b; --parch:#f1e4c3; --parch-edge:#b8913f; --inkText:#2a1a0b; --gold:#f5c34d; --gold-hi:#ffe39a;
  --mist:#1b1030; --text:#e9dcc0; --muted:#a99a7e; --boat:#6fd8ff; --panel:#0d0a07ee; --rule:#6b5123;
  --display:"Cinzel","Trajan Pro",Georgia,serif; --body:"Crimson Text",Georgia,serif; --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);overflow:hidden}
body{font-family:var(--body)}
#stage{position:fixed;inset:0}
canvas#gl{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
/* tilt-shift: the far and near edges go soft, like a model railway photographed up close */
.tilt{position:fixed;left:0;right:0;pointer-events:none;backdrop-filter:blur(3.5px);-webkit-backdrop-filter:blur(3.5px)}
.tilt.top{top:0;height:24%;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.tilt.bot{bottom:0;height:16%;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,#05030ad0 100%)}

/* labels */
#labels{position:fixed;inset:0;pointer-events:none}
.banner{position:absolute;left:0;top:0;will-change:transform,opacity;white-space:nowrap;pointer-events:auto;cursor:pointer;text-align:center;
  font-family:var(--display);font-weight:800;letter-spacing:.08em;font-size:24px;color:#fff3d2;
  text-shadow:0 0 2px #000,0 0 3px #000,0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000,0 2px 10px #000c;transition:opacity .25s ease}
.banner.here{color:var(--gold-hi)}
.banner.unknown{color:#cdbf9f;letter-spacing:.32em}
.banner.dmonly{color:#b9acd6}
.banner small{display:block;font-family:var(--ui);font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#d8c69c;margin-top:1px}
.banner.faded{opacity:.18}
.banner.poi{font-size:15px;color:#bff3ff;letter-spacing:.1em}
.banner.lesser{font-size:18px}                                    /* 25% under the 24px great places (Sam) */
.banner.lesser small{color:#c7b4e8;letter-spacing:.12em}
.banner.guardtag{font-size:14px;color:#d8c4ff;letter-spacing:.14em}
.small{opacity:.7;font-size:.85em}
.banner.marker{font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.06em;color:#e9d9ad;opacity:.85}
.banner.scenery{font-family:var(--ui);font-size:11px;font-weight:600;letter-spacing:.08em;color:#d9cfe9;border:1px dashed #9c8fbf;background:#0d0a07b0;padding:2px 6px;cursor:default}
.legend{left:18px;top:96px;width:236px;max-height:calc(100vh - 230px);overflow:auto;background:var(--panel);border:1px solid var(--rule);box-shadow:0 10px 30px #000a;padding:10px 12px;font-family:var(--ui);font-size:11.5px;color:var(--text)}
.legbtn{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;width:100%}
.legbtn #legArrow{font-family:var(--ui);font-size:10px;letter-spacing:.08em;color:#1a1208;background:var(--gold);padding:2px 7px}
.legbtn:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.legend.closed{width:auto;padding:6px 10px} .legend.closed h3{margin:0}
.legend h3{margin:0 0 6px;font-family:var(--display);font-size:13px;letter-spacing:.12em;color:var(--gold-hi)}
.legend ul[hidden]{display:none}
.legend ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.legend li{line-height:1.35}
.legend li button{all:unset;cursor:pointer;display:block;width:100%;padding:4px 2px;border-bottom:1px solid #6b512355}
.legend li button:hover,.legend li button:focus-visible{background:#f5c34d14;outline:none}
.legend li b{display:block;color:var(--gold-hi);font-weight:600}
.legend li span:last-child{color:var(--muted)} .legend b{color:var(--text);font-weight:600}
@media (max-width:760px){ .legend{top:auto;bottom:12px;left:12px;width:auto;right:12px;max-height:38vh} }
.tollbtn{all:unset;cursor:pointer;display:inline-block;margin-top:6px;font-family:var(--ui);font-size:12px;font-weight:700;color:#1a1208;background:var(--gold);padding:6px 10px}
.tollbtn:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.pip{position:absolute;transform:translate(-50%,-140%);font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.08em;color:#1a1208;background:var(--gold-hi);border-radius:10px;padding:2px 7px;box-shadow:0 2px 8px #000a;pointer-events:none;opacity:0;transition:opacity .2s}
.pip.on{opacity:1}

/* chrome */
.hud{position:fixed;z-index:5}
.title{left:18px;top:14px;padding:10px 16px 9px;background:var(--panel);border:1px solid var(--rule);box-shadow:0 10px 30px #000a}
.title h1{margin:0;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.14em;color:var(--gold-hi)}
.title p{margin:2px 0 0;font-family:var(--ui);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
/* Sam 2026-10-13: "Need a way for DM to return to main part of this Map Module" — the Campaign Atlas (places, plates, sub-artifacts). DM view only. */
.title .atlas{display:block;margin-top:7px;padding-top:6px;border-top:1px solid var(--rule);font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--gold-hi);text-decoration:none}
.title .atlas:hover,.title .atlas:focus-visible{color:#fff;outline:none}
.title .atlas[hidden]{display:none}
.toggles{right:18px;top:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
.tg{all:unset;cursor:pointer;font-family:var(--ui);font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--text);background:var(--panel);border:1px solid var(--rule);padding:8px 12px}
.tg[aria-pressed="true"]{color:#1a1208;background:var(--gold);border-color:var(--gold-hi)}
.tg:focus-visible,.go:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.card{left:50%;bottom:18px;transform:translateX(-50%);width:min(560px,calc(100vw - 32px));box-sizing:border-box;background:var(--panel);border:1px solid var(--rule);
  box-shadow:0 14px 40px #000c;padding:12px 16px;display:grid;grid-template-columns:1fr;gap:4px}
.card h2{margin:0;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.06em;color:var(--gold-hi)}
.card .meta{font-family:var(--ui);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .meta b{color:var(--text);font-weight:600}
.go{all:unset;cursor:pointer;grid-row:1/3;grid-column:2;font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.1em;color:#1a1208;background:linear-gradient(#ffe39a,#d9a43c);border:1px solid #fff0c2;padding:11px 16px;box-shadow:0 3px 0 #6b4f1c}
.go[disabled]{opacity:.4;pointer-events:none}
.keys{left:18px;bottom:18px;font-family:var(--ui);font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--rule);padding:8px 10px;line-height:1.6;max-width:240px}
.keys kbd{font-family:var(--ui);font-size:10px;color:var(--text);border:1px solid #6b5123;border-bottom-width:2px;padding:0 4px;border-radius:3px}
.clock{right:18px;bottom:18px;font-family:var(--ui);font-size:12px;color:var(--text);background:var(--panel);border:1px solid var(--rule);padding:8px 12px;font-variant-numeric:tabular-nums;text-align:right}
.clock span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.boatpick{display:flex;gap:0}.boatpick .tg+.tg{border-left:0}
.music{right:18px;top:64px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.sndrow{display:flex}.sndrow .tg+.tg{border-left:0}
.music #trackName{font-family:var(--ui);font-size:10px;letter-spacing:.08em;color:var(--muted);background:var(--panel);padding:2px 6px}
.music #trackName:empty{display:none}
.zoom{right:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
.zoom .tg{width:20px;text-align:center;font-size:16px;padding:6px 10px}
.zoom .tg.wide{width:auto;font-size:11px;letter-spacing:.06em;padding:6px 8px;white-space:nowrap}

/* GAME MODE: the leader and the boat come from the game; a player who is not the DM sees the map, the place card, zoom and sound, nothing else */
body.game #leadRow,body.game .boatpick,body.game .clock,body.game #cineBtn,body.game #trackName{display:none !important}
body.game:not(.gm) .hud.toggles,body.game:not(.gm) .hud.keys,body.game:not(.gm) #legend,body.game:not(.gm) #atlasLink{display:none !important}
body.game:not(.lead) #entEnter{display:none !important}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink);z-index:20;font-family:var(--display);letter-spacing:.2em;color:var(--gold);transition:opacity .6s}
@media (max-width:760px){ .music{top:auto;bottom:110px;right:12px} .keys,.clock{display:none} .title{left:12px;top:10px} .toggles{left:12px;right:12px;top:66px;max-width:none;justify-content:flex-start} .tg{padding:6px 9px;font-size:11px} .banner{font-size:17px} .banner.lesser{font-size:13px} .title h1{font-size:16px} .zoom{top:auto;bottom:150px;transform:none} }
@media (prefers-reduced-motion: reduce){ .banner{transition:none} }
/* arrival cinematic: letterbox, a slow push-in on the painted entrance, a title card */
#cine{position:fixed;inset:0;z-index:40;background:#000;overflow:hidden}
#cine[hidden]{display:none}
#cine .plate{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transform:scale(1.10)}
#cine.play .plate{animation:cinePlate 7.5s cubic-bezier(.2,.6,.2,1) forwards}
@keyframes cinePlate{0%{opacity:0;transform:scale(1.10)}18%{opacity:1}100%{opacity:1;transform:scale(1.0)}}
#cine video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cine .bar{position:absolute;left:0;right:0;height:12vh;background:#000;z-index:2}
#cine .bar.top{top:0} #cine .bar.bot{bottom:0}
#cine .titlecard{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;z-index:3;opacity:0;pointer-events:none}
#cine.play .titlecard{animation:cineTitle 6.5s ease forwards 1.1s}
@keyframes cineTitle{0%{opacity:0;letter-spacing:.3em}25%{opacity:1;letter-spacing:.18em}80%{opacity:1}100%{opacity:0}}
#cine .titlecard small{display:block;font-family:var(--ui);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
#cine .titlecard h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,56px);letter-spacing:.18em;color:var(--gold-hi);text-shadow:0 2px 18px rgba(0,0,0,.9),0 0 40px rgba(255,200,90,.25)}
#cine .skip{position:absolute;right:18px;bottom:calc(12vh + 14px);z-index:4}
/* the entrance: a 4K painted plate in the distance, its own ground in front, the party standing at the threshold */
#entrance{position:fixed;inset:0;z-index:38;background:#000;overflow:hidden}
#entrance[hidden]{display:none}
#entrance .far,#entrance .near{position:absolute;inset:-3%;background-size:cover;background-position:center;will-change:transform;opacity:0;transition:opacity .7s ease}
#entrance.lit .far,#entrance.lit .near{opacity:1}
#entrance video.loop{position:absolute;inset:-3%;width:106%;height:106%;object-fit:cover;opacity:0;transition:opacity .9s ease;will-change:transform}
#entrance.live video.loop{opacity:1}
#entrance.live .near{opacity:0}
.card .meta.say{color:#f3e4bb;font-style:italic;margin-top:4px;font-family:var(--body);font-size:13px}
#entrance .near{-webkit-mask-image:linear-gradient(to top,#000 0,#000 18%,transparent 34%);mask-image:linear-gradient(to top,#000 0,#000 18%,transparent 34%);transform:scale(1.04)}
#entrance .mist{position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 35% at 30% 78%,rgba(120,150,255,.10),transparent 70%),radial-gradient(50% 30% at 72% 72%,rgba(180,120,255,.08),transparent 70%);animation:mist 14s ease-in-out infinite alternate}
@keyframes mist{from{transform:translateX(-1.5%)}to{transform:translateX(1.5%)}}
#entrance canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;image-rendering:pixelated}
#entrance .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
#entrance .entHud{position:absolute;left:18px;right:18px;bottom:22px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
#entrance .entHud h2{margin:0;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.08em;color:var(--gold-hi);text-shadow:0 2px 12px #000}
#entrance .entHud p{margin:4px 0 0;font-family:var(--ui);font-size:12px;color:var(--muted);text-shadow:0 1px 6px #000;max-width:560px}
#entrance .entHud .btns{display:flex;gap:8px}
.soon{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:9px;font-size:9px;letter-spacing:.1em;background:rgba(255,200,90,.18);color:var(--gold-hi);vertical-align:1px}
@media (prefers-reduced-motion: reduce){ #cine.play .plate{animation:none;opacity:1;transform:none} #entrance .mist{animation:none} }
</style>

  return {a:e.a,b:e.b,m:e.m==="sail"||e.m==="dive"?e.m:"walk",o:l?(l.a===e.a?l.o:-l.o):0,mi:Number(e.mi)||1,d:!!e.d}; }

const known=new Set(G.nodes.filter(n=>n.d).map(n=>n.k));
const knownE=new Set(E.filter(e=>e.d).map(eKey));
function eKey(e){ return e.a<e.b? e.a+"|"+e.b : e.b+"|"+e.a }
function eKnown(e){ return GAME ? (known.has(e.a)&&known.has(e.b)) : knownE.has( eKey(e) ); }
// Proposed rule shown here: standing somewhere reveals every road out of it and the stop at its far end.
function revealAround(k){ known.add(k); if(GAME) return; for(const e of E){ if((e.a===k||e.b===k)&&(e.m!=="sail"||boat)&&(e.m!=="dive"||caveFound)&&(e.m!=="portal"||e.a===k)&&(!e.s||groveFound)){ knownE.add(eKey(e)); known.add(e.a===k?e.b:e.a); } } }

const visibleEdge=e=> dm ? true : GAME ? usable(e) : (usable(e) && reach.has(e.a) && reach.has(e.b));

const W=33.44, H=18.82;
const toW=(x,y)=>new THREE.Vector3(x*2/100-W/2, 0, y*2/100-H/2);
function curvePts(e,n=48){
  const A=N.get(e.a), B=N.get(e.b); const dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy)||1;
  const cx=(A.x+B.x)/2-dy/L*e.o, cy=(A.y+B.y)/2+dx/L*e.o, pts=[];
  for(let i=0;i<=n;i++){ const t=i/n; pts.push(toW((1-t)**2*A.x+2*(1-t)*t*cx+t*t*B.x,(1-t)**2*A.y+2*(1-t)*t*cy+t*t*B.y)); }
  return pts;
}

const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
function stopAt(e){
  mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObject(ground)[0]; if(!hit) return null;
  let best=null, bd=.7+cam.dist*.02;
  for(const [k,g] of stops){ if(!g.visible) continue; const d=g.position.distanceTo(hit.point)-(N.get(k).t==="location"?.5:0); if(d<bd){ bd=d; best=k; } }
  return best;
}

function route(from,to,allowGuard){
  const adj=new Map(); for(const e of E){ if(!walkable(e,allowGuard)) continue; for(const [a,b] of (e.oneWay?[[e.a,e.b]]:[[e.a,e.b],[e.b,e.a]])){ if(!adj.has(a)) adj.set(a,[]); adj.get(a).push({to:b,e}); } }
  const dist=new Map([[from,0]]), prev=new Map(), done=new Set();
  for(;;){ let cur=null,best=1e9; for(const [k,v] of dist) if(!done.has(k)&&v<best){best=v;cur=k;} if(!cur||cur===to) break; done.add(cur);
    for(const {to:nx,e} of adj.get(cur)||[]){ const nd=best+e.mi; if(nd<(dist.get(nx)??1e9)){ dist.set(nx,nd); prev.set(nx,{k:cur,e}); } } }
  if(!dist.has(to)) return null;
  const legs=[]; let k=to; while(k!==from){ const p=prev.get(k); legs.unshift({from:p.k,to:k,e:p.e}); k=p.k; }
  return {miles:dist.get(to),legs};
}

  const ways=E.filter(e=>(e.a===n.k||e.b===n.k)&&visibleEdge(e)).length; return ways<=1? "Dead end" : ways===2? "On the road" : "A fork in the road"; };

}

/* travel: one press, eased start and stop, a small hop on arrival, and a queued next step */
let walking=null, marched=0, queued=null, hop=0, travelSail=false;
function goTo(k){
  if(overview&&k!==party&&!downed){ overview=false; cam.goalDist=Math.min(cam.goalDist,15); }   // setting off again brings the camera back down to the party
  if(PLATES[k]){ const P=PLATES[k]; const img=P._pre||(P._pre=new Image()); if(!img.src) img.src=P.url; }   // start fetching the 4K entrance plate while the party walks
  if(k===party||downed) return;

  if(GAME&&!gameLegP){ if(gameLead) post({type:"aop:map-pick",k}); return; }
  let p=gameLegP||route(party,k), atGate=false; gameLegP=null;
  if(!p){ const b=route(party,k,true);
    if(b&&b.legs.some(L=>L.e.g)){ const i=b.legs.findIndex(L=>L.e.g);
      if(i===0){ showToll(); return; }
      const legs=b.legs.slice(0,i); p={legs,miles:legs.reduce((m,L)=>m+L.e.mi,0)}; k=legs[legs.length-1].to; atGate=true; }
    else { showCard(k); return; } }
  // the way into the cave is a swim against the falls' current, until someone shuts the falls off from inside
  const di=p.legs.findIndex(L=>L.e.m==="dive"&&L.to==="pool-cave");
  if(di>=0 && !fallsOff && !swimOk){ if(di===0){ dive(); return; } const legs=p.legs.slice(0,di); p={legs,miles:legs.reduce((m,L)=>m+L.e.mi,0)}; k="road-09"; }
  swimOk=false;

  const segs=[]; for(const L of p.legs){ const mode=L.e.m; const c=L.from===L.e.a?L.e.pts:[...L.e.pts].reverse();
    if(!segs.length||segs[segs.length-1].mode!==mode) segs.push({mode,pts:[]}); const S=segs[segs.length-1]; c.forEach((q,i)=>{ if(i||!S.pts.length) S.pts.push(q); }); }
  const plan=[]; segs.forEach((S,i)=>{ const curve=new THREE.CatmullRomCurve3(S.pts), len=curve.getLength();
    if(S.mode==="sail" && (i===0||segs[i-1].mode!=="sail")) plan.push({kind:"board",curve,dur:.5});
    plan.push({kind:S.mode==="dive"&&fallsOff?"walk":S.mode,curve,len,dur:S.mode==="portal"?2.4:S.mode==="dive"?1.6:Math.max(.55,len/(S.mode==="sail"?4.4:5.2))});
    if(S.mode==="sail" && (i===segs.length-1||segs[i+1].mode!=="sail")) plan.push({kind:"land",curve,dur:.5}); });
  walking={plan,i:0,t:0,legs:p.legs,miles:p.miles,dest:k,atGate}; travelSail=p.legs.some(L=>L.e.m==="sail");
  playTrack(trackFor(k,true)); marchStart(); setBed(bedFor(k,true)); duckMusic(true);
  preview.clear(); hovered=null; setSheet(plan[0].kind==="walk"?"walk":"idle"); showCard(k);
  card.meta.innerHTML+= p.legs.some(L=>L.e.m==="portal") ? (p.legs.every(L=>L.e.m==="portal")?"":" · through the portal") : p.legs.some(L=>L.e.m==="dive") ? (fallsOff?" · in behind the stopped falls":" · down through the pool") : p.legs.some(L=>L.e.m==="sail") ? " · by water and road" : " · walking";
}

const LINE_VOL=.9; let lineAudio=null, lineTimer=null, lineCap=null;
function sayLine(k,now){

  clearTimeout(lineTimer);
  lineTimer=setTimeout(()=>{
    if(party!==k) return;
    if(lineAudio){ try{ lineAudio.pause(); }catch(e){} }
    const a=new Audio(L.u); a.preload="auto"; a.volume=LINE_VOL; lineAudio=a;
    const m=decks[deck], restore=()=>{ if(!m.paused) fade(m,ducked?VOL*.8:VOL,900); if(lineCap){ lineCap.remove(); lineCap=null; } };
    if(!m.paused) fade(m,VOL*.45,500);
    a.onended=restore; a.onerror=restore;
    a.play().then(()=>{
      lineCap=document.createElement("div"); lineCap.className="meta say"; lineCap.innerHTML='<b>'+LEADERS[leader]+'</b> — \u201c'+L.t+'\u201d'; document.getElementById("card").appendChild(lineCap);
    }).catch(restore);

}
function arrive(){
  const w=walking; walking=null; const firstVisit=!visited.has(w.dest); party=w.dest; playTrack(trackFor(party,false));
  arrivals[party]=(arrivals[party]||0)+1; visited.add(party); marched+=w.miles; hop=1;
  // an ordinary arrival is silent now; only the first sight of a great place sounds
  marchStop(); duckMusic(false); setBed(bedFor(party,false));
  if(firstVisit && N.get(party).t==="location") sfx("discover");
  if(firstVisit && LINES[leader][party]) sayLine(party);
  if(!w.atGate && PLATES[party] && cineOn && (!GAME||gameLast)) setTimeout(()=>startCinematic(party),420);
  for(const L of w.legs){ knownE.add(eKey(L.e)); revealAround(L.to); }
  setSheet("idle"); refresh(); showCard(party);
  const n=N.get(party); document.getElementById("where").textContent = n.t==="location"&&nameShown(n) ? n.n : "On the road";
  document.getElementById("miles").textContent=marched.toFixed(1)+" mi";
  document.getElementById("days").textContent="day "+(1+Math.floor(marched/PACE));
  if(GAME){ gameWhere(); post({type:"aop:map-reached",k:party}); return; }

}
function step(d){
  if(GAME&&(!gameLead||walking)) return;
  if(walking){ queued={dir:d}; return; }
  // screen-space directions, so "up" is always up on the screen whatever the camera is doing
  const here=stops.get(party).position.clone().project(camera); let best=null, bestE=null, bs=.35;
  for(const e of E){ if(!walkable(e,true)) continue; const o= e.a===party?e.b: (e.b===party&&!e.oneWay)?e.a : null; if(!o) continue;
    const there=stops.get(o).position.clone().project(camera); const vx=there.x-here.x, vy=-(there.y-here.y), L=Math.hypot(vx,vy)||1, s=(vx*d[0]+vy*d[1])/L;
    if(s>bs){ bs=s; best=o; bestE=e; } }
  // stepping onto the guarded bridge meets the knight, never a long detour around him
  if(best && bestE.g && !tollPaid){ showToll(); return; }
  if(best) goTo(best);
}
